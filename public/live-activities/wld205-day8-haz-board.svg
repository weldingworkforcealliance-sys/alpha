<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><rect width="1200" height="1500" fill="white"/><rect x="20" y="20" width="1160" height="1460" rx="18" fill="none" stroke="#222" stroke-width="3"/><rect x="40" y="40" width="1120" height="100" rx="12" fill="#102014"/><text x="65" y="82" font-family="Arial" font-size="21" fill="#caff77" font-weight="700">PVHS LEVEL II · 4-DAY READINESS REVIEW · DAY 4 OF 4</text><text x="65" y="122" font-family="Arial" font-size="34" fill="white" font-weight="700">HEAT, HAZ + OBSERVABLE CHANGE</text><text x="55" y="190" font-family="Arial" font-size="25" font-weight="700">STEP 1 · IDENTIFY THE REGION</text><text x="55" y="220" font-family="Arial" font-size="18">Questions 1–3. The HAZ is unmelted base metal affected by welding heat.</text><rect x="100" y="285" width="1000" height="175" rx="12" fill="#eeeeee" stroke="#333"/><path d="M430 285 Q600 105 770 285 Z" fill="#d0d0d0" stroke="#222" stroke-width="3"/><path d="M405 285 L430 285 Q475 355 525 460 L395 460 Z" fill="#fafafa" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/><path d="M770 285 L795 285 L805 460 L675 460 Q725 355 770 285 Z" fill="#fafafa" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/><line x1="430" y1="285" x2="525" y2="460" stroke="#444" stroke-width="2" stroke-dasharray="6 5"/><line x1="770" y1="285" x2="675" y2="460" stroke="#444" stroke-width="2" stroke-dasharray="6 5"/><text x="585" y="245" font-family="Arial" font-size="32" font-weight="700">A</text><text x="458" y="385" font-family="Arial" font-size="32" font-weight="700">B</text><text x="235" y="385" font-family="Arial" font-size="32" font-weight="700">C</text><text x="820" y="385" font-family="Arial" font-size="17">unaffected base metal</text><text x="120" y="505" font-family="Arial" font-size="19">A = weld metal · B = heat-affected zone (HAZ) · C = unaffected base metal</text><text x="55" y="575" font-family="Arial" font-size="25" font-weight="700">STEP 2 · CONNECT HEAT TO THE HAZ</text><rect x="55" y="600" width="1090" height="175" rx="14" fill="#f7f7f7" stroke="#555"/><g font-family="Arial"><text x="80" y="642" font-size="20" font-weight="700">WELD HEAT</text><line x1="205" y1="635" x2="360" y2="635" stroke="#222" stroke-width="4"/><polygon points="360,635 335,620 335,650" fill="#222"/><text x="400" y="642" font-size="20" font-weight="700">THERMAL CYCLE IN NEARBY BASE METAL</text><line x1="800" y1="635" x2="930" y2="635" stroke="#222" stroke-width="4"/><polygon points="930,635 905,620 905,650" fill="#222"/><text x="955" y="642" font-size="20" font-weight="700">HAZ</text><text x="80" y="700" font-size="18">The HAZ changed because of heat, but it did not melt.</text><text x="80" y="738" font-size="17">Exact hardness, microstructure, and response require source / procedure / testing context.</text></g><text x="55" y="835" font-family="Arial" font-size="25" font-weight="700">STEP 3 · OBSERVE + CHECK SOURCE</text><g font-family="Arial"><g transform="translate(55,865)"><rect width="340" height="225" rx="12" fill="#fafafa" stroke="#555"/><text x="20" y="38" font-size="20" font-weight="700">VISIBLE HAZ</text><text x="20" y="82" font-size="17">Observation:</text><text x="20" y="110" font-size="17">A heat-affected region is visible.</text><text x="20" y="150" font-size="17" font-weight="700">Do NOT conclude:</text><text x="20" y="178" font-size="17">exact hardness from appearance.</text></g><g transform="translate(430,865)"><rect width="340" height="225" rx="12" fill="#fafafa" stroke="#555"/><text x="20" y="38" font-size="20" font-weight="700">HIGH RESTRAINT</text><text x="20" y="82" font-size="17">Possible concerns:</text><text x="20" y="110" font-size="17">stress / distortion / cracking.</text><text x="20" y="150" font-size="17" font-weight="700">Do NOT conclude:</text><text x="20" y="178" font-size="17">one exact cause without evaluation.</text></g><g transform="translate(805,865)"><rect width="340" height="225" rx="12" fill="#fafafa" stroke="#555"/><text x="20" y="38" font-size="20" font-weight="700">THICKNESS / CONDUCTIVITY</text><text x="20" y="82" font-size="17">Geometry and material affect</text><text x="20" y="110" font-size="17">how heat moves and cools.</text><text x="20" y="150" font-size="17" font-weight="700">CHECK:</text><text x="20" y="178" font-size="17">material + WPS/procedure source.</text></g></g><rect x="55" y="1130" width="1090" height="190" rx="14" fill="#f7f7f7" stroke="#555"/><text x="80" y="1172" font-family="Arial" font-size="22" font-weight="700">HEAT-EFFECT REASONING</text><text x="80" y="1210" font-family="Arial" font-size="18">Higher restraint → possible stress / distortion / cracking concerns → CHECK SOURCE</text><text x="80" y="1245" font-family="Arial" font-size="18">Higher thermal conductivity → heat moves away faster → CHECK MATERIAL / PROCEDURE</text><text x="80" y="1280" font-family="Arial" font-size="18">Uncontrolled heat input / sequence → distortion / HAZ-property concerns → CHECK PROCEDURE</text><rect x="55" y="1360" width="1090" height="90" rx="14" fill="#102014"/><text x="80" y="1400" font-family="Arial" font-size="24" fill="#caff77" font-weight="700">STEP 4 · EXIT CHECK — QUESTIONS 10–12 · NO COACHING</text><text x="80" y="1430" font-family="Arial" font-size="17" fill="white">IDENTIFY / OBSERVE → CHECK SOURCE → STATE ONLY WHAT THE EVIDENCE SUPPORTS</text></svg>