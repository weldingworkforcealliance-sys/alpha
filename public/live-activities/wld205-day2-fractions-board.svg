<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250">
<rect width="1200" height="1250" fill="white"/>
<rect x="20" y="20" width="1160" height="1210" fill="none" stroke="#222" stroke-width="2"/>
<text x="55" y="70" font-family="Arial" font-size="34" font-weight="700">WLD 205 DAY 2 — MATH RECOVERY I</text>
<text x="55" y="108" font-family="Arial" font-size="21">Measurement, Fractions + Mixed Numbers</text>
<rect x="50" y="150" width="1100" height="240" rx="10" fill="#f7f7f7" stroke="#555"/><text x="72" y="188" font-family="Arial" font-size="24" font-weight="700">Rule Reading Cards</text><text x="85" y="220" font-family="Arial" font-size="22">A: 1/4 in</text>
<text x="85" y="258" font-family="Arial" font-size="22">B: 3/8 in</text>
<text x="85" y="296" font-family="Arial" font-size="22">C: 7/16 in</text>
<text x="85" y="334" font-family="Arial" font-size="22">D: 1 5/8 in</text>
<text x="85" y="372" font-family="Arial" font-size="22">Record every measurement with units.</text><rect x="50" y="415" width="1100" height="360" rx="10" fill="#f7f7f7" stroke="#555"/><text x="72" y="453" font-family="Arial" font-size="24" font-weight="700">Fraction Shop Set A</text><text x="85" y="485" font-family="Arial" font-size="22">A1  2 3/8 + 1 7/8</text>
<text x="85" y="531" font-family="Arial" font-size="22">A2  6 1/2 - 2 3/16</text>
<text x="85" y="577" font-family="Arial" font-size="22">A3  3 × 1 1/4</text>
<text x="85" y="623" font-family="Arial" font-size="22">A4  7 1/2 ÷ 3</text>
<text x="85" y="669" font-family="Arial" font-size="22">Cut task: 8 3/4 + 6 1/2 + 4 7/8; then subtract from 24 in stock.</text>
<text x="85" y="715" font-family="Arial" font-size="22">Whiteboard check: estimate first, calculate, then verify.</text><rect x="50" y="800" width="1100" height="380" rx="10" fill="#f7f7f7" stroke="#555"/><text x="72" y="838" font-family="Arial" font-size="24" font-weight="700">Independent Check</text><text x="85" y="875" font-family="Arial" font-size="22">1) 1 5/16 + 2 7/8</text>
<text x="85" y="925" font-family="Arial" font-size="22">2) 5 3/4 - 1 11/16</text>
<text x="85" y="975" font-family="Arial" font-size="22">3) 4 × 7/8</text>
<text x="85" y="1025" font-family="Arial" font-size="22">4) 9 3/8 ÷ 2</text>
<text x="85" y="1075" font-family="Arial" font-size="22">Do not copy a neighbor’s method. Show one reasonableness check.</text>
</svg>