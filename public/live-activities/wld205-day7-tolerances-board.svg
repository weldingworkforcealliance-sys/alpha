<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
<rect width="1200" height="1500" fill="white"/>
<rect x="20" y="20" width="1160" height="1460" rx="18" fill="none" stroke="#222" stroke-width="3"/>
<rect x="40" y="40" width="1120" height="100" rx="12" fill="#102014"/>
<text x="65" y="82" font-family="Arial" font-size="21" fill="#caff77" font-weight="700">PVHS LEVEL II · 4-DAY READINESS REVIEW · DAY 3 OF 4</text>
<text x="65" y="122" font-family="Arial" font-size="34" fill="white" font-weight="700">TOLERANCES — LIMITS, ACTUAL, DECISION</text>

<text x="55" y="190" font-family="Arial" font-size="25" font-weight="700">STEP 1 · FIND THE LIMITS</text>
<text x="55" y="222" font-family="Arial" font-size="20">Example: 2.000 ± 0.030 in → LOWER 1.970 in / UPPER 2.030 in</text>
<rect x="100" y="275" width="1000" height="44" rx="8" fill="#efefef" stroke="#333"/>
<rect x="250" y="275" width="700" height="44" fill="#d9ead3" stroke="none"/>
<line x1="250" y1="255" x2="250" y2="340" stroke="#222" stroke-width="3"/><line x1="600" y1="255" x2="600" y2="340" stroke="#222" stroke-width="3"/><line x1="950" y1="255" x2="950" y2="340" stroke="#222" stroke-width="3"/>
<text x="208" y="365" font-family="Arial" font-size="18">1.970</text><text x="565" y="365" font-family="Arial" font-size="18">2.000</text><text x="910" y="365" font-family="Arial" font-size="18">2.030</text><text x="425" y="305" font-family="Arial" font-size="18" font-weight="700">ACCEPTABLE ZONE</text>

<text x="55" y="425" font-family="Arial" font-size="25" font-weight="700">STEP 2 · COMPARE THE ACTUAL</text>
<g transform="translate(55,455)" font-family="Arial"><rect width="525" height="260" rx="14" fill="#f7f7f7" stroke="#555"/><text x="24" y="42" font-size="22" font-weight="700">CASE A · ACTUAL 2.025 in</text><line x1="65" y1="125" x2="455" y2="125" stroke="#555" stroke-width="10" stroke-linecap="round"/><line x1="110" y1="98" x2="110" y2="152" stroke="#222" stroke-width="3"/><line x1="410" y1="98" x2="410" y2="152" stroke="#222" stroke-width="3"/><circle cx="385" cy="125" r="13" fill="#222"/><text x="70" y="185" font-size="17">1.970</text><text x="375" y="185" font-size="17">2.030</text><text x="24" y="225" font-size="22" font-weight="700">INSIDE LIMITS → ACCEPT</text></g>
<g transform="translate(620,455)" font-family="Arial"><rect width="525" height="260" rx="14" fill="#f7f7f7" stroke="#555"/><text x="24" y="42" font-size="22" font-weight="700">CASE B · ACTUAL 2.036 in</text><line x1="65" y1="125" x2="455" y2="125" stroke="#555" stroke-width="10" stroke-linecap="round"/><line x1="110" y1="98" x2="110" y2="152" stroke="#222" stroke-width="3"/><line x1="410" y1="98" x2="410" y2="152" stroke="#222" stroke-width="3"/><circle cx="445" cy="125" r="13" fill="#222"/><text x="70" y="185" font-size="17">1.970</text><text x="375" y="185" font-size="17">2.030</text><text x="24" y="225" font-size="22" font-weight="700">ABOVE LIMIT → REJECT</text></g>

<rect x="55" y="750" width="1090" height="115" rx="12" fill="#f7f7f7" stroke="#555"/><text x="80" y="790" font-family="Arial" font-size="22" font-weight="700">FRACTION CHECK</text><text x="80" y="830" font-family="Arial" font-size="21">1 1/2 ± 1/32 in = 1 15/32 in to 1 17/32 in</text>

<text x="55" y="930" font-family="Arial" font-size="25" font-weight="700">STEP 3 · DECIDE + DOCUMENT</text>
<rect x="55" y="955" width="1090" height="300" rx="14" fill="#f7f7f7" stroke="#555"/>
<g font-family="Arial"><text x="80" y="1000" font-size="22" font-weight="700">MOCK MEASUREMENT RECORD — DIMENSION B</text><text x="80" y="1045" font-size="21">Requirement: 8.000 ± 0.010 in</text><text x="80" y="1085" font-size="21">Limits: 7.990 in to 8.010 in</text><text x="80" y="1125" font-size="21">Actual: 7.984 in</text><text x="80" y="1170" font-size="22" font-weight="700">DECISION: BELOW LOWER LIMIT → REJECT / HOLD FOR RECHECK</text><text x="80" y="1210" font-size="18">Record the actual measurement. Do not erase it. Follow the applicable correction/recheck procedure.</text></g>

<rect x="55" y="1300" width="1090" height="135" rx="14" fill="#102014"/><text x="80" y="1343" font-family="Arial" font-size="24" fill="#caff77" font-weight="700">STEP 4 · EXIT CHECK — QUESTIONS 12–15 · NO COACHING</text><text x="80" y="1385" font-family="Arial" font-size="20" fill="white">NOMINAL → LIMITS → ACTUAL → DECISION → DOCUMENT</text><text x="80" y="1418" font-family="Arial" font-size="16" fill="#ddd">The approved print/tolerance source controls real work.</text>
</svg>