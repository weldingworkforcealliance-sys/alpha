<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280">
<rect width="1200" height="1280" fill="white"/>
<rect x="20" y="20" width="1160" height="1240" fill="none" stroke="#222" stroke-width="2"/>
<text x="55" y="70" font-family="Arial" font-size="34" font-weight="700">WLD 205 DAY 7 — MATH RECOVERY III</text>
<text x="55" y="108" font-family="Arial" font-size="21">Tolerances + Accept/Reject Reasoning</text>
<rect x="50" y="150" width="1100" height="220" rx="10" fill="#f7f7f7" stroke="#555"/><text x="72" y="188" font-family="Arial" font-size="24" font-weight="700">Standing Decision Chain</text><text x="85" y="230" font-family="Arial" font-size="24">NOMINAL → LIMITS → ACTUAL → DECISION</text>
<text x="85" y="278" font-family="Arial" font-size="24">Write lower and upper limits before judging the measured value.</text><rect x="50" y="395" width="1100" height="410" rx="10" fill="#f7f7f7" stroke="#555"/><text x="72" y="433" font-family="Arial" font-size="24" font-weight="700">Tolerance Cards + Set A</text><text x="85" y="475" font-family="Arial" font-size="22">Card A: 2.000 ± 0.030</text>
<text x="85" y="525" font-family="Arial" font-size="22">Card B: 6.500 ± 0.015</text>
<text x="85" y="575" font-family="Arial" font-size="22">Card C: 1 1/2 ± 1/32</text>
<text x="85" y="625" font-family="Arial" font-size="22">Set A uses actuals: 2.025, 2.036, 6.490, 6.518, 1.481, 1.477.</text>
<text x="85" y="675" font-family="Arial" font-size="22">Every decision needs limits + unit.</text><rect x="50" y="830" width="1100" height="380" rx="10" fill="#f7f7f7" stroke="#555"/><text x="72" y="868" font-family="Arial" font-size="24" font-weight="700">Mock Record / Recheck</text><text x="85" y="910" font-family="Arial" font-size="21">A: 4.002 for 4.000 ± 0.010</text>
<text x="85" y="960" font-family="Arial" font-size="21">B: 7.984 for 8.000 ± 0.010</text>
<text x="85" y="1010" font-family="Arial" font-size="21">C: 2.496 for 2.500 ± 0.008</text>
<text x="85" y="1060" font-family="Arial" font-size="21">For any out-of-tolerance result: state actual, limit, direction, and hold/recheck action.</text>
<text x="85" y="1110" font-family="Arial" font-size="21">Do not erase the original measurement.</text>
</svg>