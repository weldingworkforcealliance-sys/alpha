<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><rect width="1800" height="1200" fill="white"/><rect x="18" y="18" width="1764" height="1164" fill="none" stroke="#111" stroke-width="4"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.h1{font-size:42px;font-weight:700}.h2{font-size:28px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.ln{stroke:#111;stroke-width:4;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.dash{stroke:#666;stroke-width:2;stroke-dasharray:12 9;fill:none}.center{stroke:#777;stroke-width:2;stroke-dasharray:18 7 3 7;fill:none}.box{fill:#f8f8f8;stroke:#444;stroke-width:2}</style><text x="55" y="78" class="h1">BLUEPRINT READING — DAY 1: V-GROOVE TEST BLOCK</text><text x="55" y="118" class="t">Training reference • three-view orthographic reading • line types • dimensions • notes</text>
<rect x="55" y="155" width="1100" height="765" rx="12" class="box"/><text x="90" y="205" class="h2">ORTHOGRAPHIC VIEWS</text>
<text x="115" y="265" class="t">FRONT VIEW</text><rect x="110" y="300" width="390" height="260" class="ln"/><path d="M240 300 L305 390 L370 300" class="ln"/><line x1="305" y1="315" x2="305" y2="545" class="center"/><line x1="140" y1="430" x2="470" y2="430" class="dash"/>
<text x="590" y="265" class="t">TOP VIEW</text><rect x="580" y="300" width="390" height="190" class="ln"/><line x1="580" y1="395" x2="970" y2="395" class="center"/><line x1="775" y1="315" x2="775" y2="475" class="center"/>
<text x="590" y="590" class="t">RIGHT-SIDE VIEW</text><rect x="580" y="625" width="260" height="210" class="ln"/><path d="M650 625 L710 700 L770 625" class="dash"/>
<line x1="110" y1="610" x2="500" y2="610" class="thin"/><line x1="110" y1="580" x2="110" y2="630" class="thin"/><line x1="500" y1="580" x2="500" y2="630" class="thin"/><text x="250" y="600" class="t">6.00</text><line x1="70" y1="300" x2="70" y2="560" class="thin"/><line x1="55" y1="300" x2="90" y2="300" class="thin"/><line x1="55" y1="560" x2="90" y2="560" class="thin"/><text x="35" y="455" class="t" transform="rotate(-90 35 455)">4.00</text>
<text x="105" y="690" class="t">Object line = visible edge</text><line x1="110" y1="720" x2="280" y2="720" class="ln"/><text x="105" y="770" class="t">Hidden line = feature not visible in that view</text><line x1="110" y1="800" x2="280" y2="800" class="dash"/><text x="105" y="850" class="t">Centerline = center/symmetry of circular or symmetric feature</text><line x1="110" y1="880" x2="280" y2="880" class="center"/>
<rect x="1200" y="155" width="545" height="765" rx="12" class="box"/><text x="1230" y="205" class="h2">TITLE BLOCK / NOTES</text><text x="1240" y="270" class="t">PART: V-GROOVE TEST BLOCK</text><text x="1240" y="315" class="t">MATERIAL: STEEL</text><text x="1240" y="360" class="t">QTY: 1</text><text x="1240" y="405" class="t">REV: TRAINING</text><text x="1240" y="470" class="t">NOTES:</text><text x="1260" y="515" class="t">1. Use dimensions shown.</text><text x="1260" y="560" class="t">2. Do not scale drawing.</text><text x="1260" y="605" class="t">3. Compare all views.</text><text x="1260" y="650" class="t">4. Verify notes before work.</text><text x="1230" y="725" class="s">Dimension lines show size/distance. Extension lines connect the feature to the dimension. A diameter symbol applies to the full distance across a circle.</text><text x="1230" y="815" class="s">Reference dimensions provide information but do not control production size unless the governing print/procedure says otherwise.</text>
<text x="55" y="1000" class="h2">READING HABIT</text><text x="55" y="1050" class="t">Compare front, top, and right-side views before deciding what a feature means. Prove the answer from views, line types, dimensions, and notes.</text></svg>