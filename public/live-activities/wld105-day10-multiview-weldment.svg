<rect x="180" y="240" width="470" height="230" class="fill"/>
<line x1="415" y1="210" x2="415" y2="535" class="center"/>
<line x1="105" y1="550" x2="725" y2="550" class="dim" marker-start="url(#dimA)" marker-end="url(#dimA)"/>
<line x1="105" y1="510" x2="105" y2="570" class="thin"/><line x1="725" y1="510" x2="725" y2="570" class="thin"/>
<rect x="350" y="528" width="132" height="32" fill="#fff"/><text x="367" y="551" class="t">8.00 ± .03</text>
