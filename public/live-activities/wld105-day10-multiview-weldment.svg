<line x1="1120" y1="855" x2="1120" y2="1087" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="1124" y1="855" x2="1163" y2="855" class="thin"/><line x1="1124" y1="1087" x2="1163" y2="1087" class="thin"/>
<rect x="1069" y="958" width="78" height="28" class="labelbg"/><text x="1078" y="979" class="dimtxt">3.00</text>
<text x="1210" y="875" class="s">VERTICAL PLATE CENTERED</text><text x="1210" y="901" class="s">ON BASE DEPTH</text>

