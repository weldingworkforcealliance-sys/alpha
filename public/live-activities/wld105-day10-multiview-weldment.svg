<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
<title id="title">WLD 105 Day 10 Multi-View Weldment Training Print</title>
<desc id="desc">Training weldment drawing with front, top, and right-side views, dimensions, two through holes, fillet weld information, material notes, tolerance, inspection notes, and title block.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}.h1{font-size:38px;font-weight:700}.h2{font-size:25px;font-weight:700}.t{font-size:20px}.s{font-size:17px}.xs{font-size:15px}.ln{stroke:#111;stroke-width:4;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.dim{stroke:#333;stroke-width:2;fill:none}.center{stroke:#666;stroke-width:1.8;stroke-dasharray:18 8 4 8;fill:none}.fill{fill:#f7f7f7;stroke:#111;stroke-width:3}.note{fill:#fbfbfb;stroke:#555;stroke-width:2}.weld{stroke:#111;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#111"/></marker>
<marker id="dimA" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M0,4.5 L9,0 L9,9 z" fill="#333"/></marker>
</defs>
<rect width="1800" height="1280" fill="#fff"/>
<rect x="18" y="18" width="1764" height="1244" fill="none" stroke="#111" stroke-width="4"/>
<text x="55" y="70" class="h1">WLD 105 — DAY 10 MULTI-VIEW WELDMENT TRAINING PRINT</text>
<text x="55" y="108" class="t">Read all views, dimensions, notes, tolerance, and weld information together before making fabrication decisions.</text>
