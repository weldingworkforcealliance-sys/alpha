<line x1="815" y1="325" x2="520" y2="445" class="weld" marker-end="url(#arrow)"/>
<line x1="815" y1="325" x2="1090" y2="325" class="weld"/>
<path d="M880 325 L880 295 L910 325" class="weld"/>
<path d="M880 325 L880 355 L910 325" class="weld"/>
<text x="838" y="318" class="t">1/4</text><text x="944" y="318" class="t">6.00</text>
<text x="810" y="278" class="s">1/4 FILLET, BOTH SIDES, CONTINUOUS 6.00</text>
<text x="85" y="700" class="h2">TOP VIEW</text>
<rect x="105" y="735" width="620" height="390" class="fill"/>
<rect x="180" y="922" width="470" height="20" class="fill"/>
<line x1="415" y1="715" x2="415" y2="1145" class="center"/>
<line x1="85" y1="930" x2="745" y2="930" class="center"/>
