<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
<title id="title">WLD 105 Day 10 Multi-View Weldment Training Print</title>
<desc id="desc">Training weldment drawing with front, top, and right-side views, readable dimensions, layout chains, two through holes, fillet weld information, material notes, tolerance, inspection notes, and title block.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}.h1{font-size:38px;font-weight:700}.h2{font-size:26px;font-weight:700}.t{font-size:21px}.s{font-size:18px}.xs{font-size:15px}.ln{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:1.6;fill:none}.dim{stroke:#222;stroke-width:1.8;fill:none}.center{stroke:#666;stroke-width:1.4;stroke-dasharray:16 7 4 7;fill:none}.fill{fill:#fafafa;stroke:#111;stroke-width:2.4}.note{fill:#fff;stroke:#555;stroke-width:1.8}.weld{stroke:#111;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.dimtxt{font-size:18px;fill:#111}.labelbg{fill:#fff}
</style>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#111"/></marker>
<marker id="dimStart" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="dimEnd" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#222"/></marker>
</defs>
<rect width="1800" height="1280" fill="#fff"/>
<rect x="18" y="18" width="1764" height="1244" fill="none" stroke="#111" stroke-width="3"/>
<text x="55" y="70" class="h1">WLD 105 — DAY 10 MULTI-VIEW WELDMENT TRAINING PRINT</text>
<text x="55" y="108" class="t">Read all views, dimensions, notes, tolerance, and weld information together before making fabrication decisions.</text>

<!-- FRONT VIEW -->
<text x="85" y="165" class="h2">FRONT VIEW</text>
<rect x="105" y="470" width="620" height="38" class="fill"/>
<rect x="180" y="240" width="470" height="230" class="fill"/>
<line x1="415" y1="210" x2="415" y2="535" class="center"/>

<!-- Front overall width -->
<line x1="105" y1="550" x2="725" y2="550" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="105" y1="508" x2="105" y2="570" class="thin"/><line x1="725" y1="508" x2="725" y2="570" class="thin"/>
<rect x="347" y="531" width="140" height="28" class="labelbg"/><text x="360" y="552" class="dimtxt">8.00 ± .03</text>

<!-- Front plate width -->
<line x1="180" y1="200" x2="650" y2="200" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="180" y1="204" x2="180" y2="238" class="thin"/><line x1="650" y1="204" x2="650" y2="238" class="thin"/>
<rect x="362" y="183" width="104" height="26" class="labelbg"/><text x="379" y="203" class="dimtxt">6.00</text>

<!-- Front plate height -->
<line x1="145" y1="240" x2="145" y2="470" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="149" y1="240" x2="178" y2="240" class="thin"/><line x1="149" y1="470" x2="178" y2="470" class="thin"/>
<rect x="99" y="340" width="85" height="29" class="labelbg"/><text x="108" y="362" class="dimtxt">3.00</text>

<!-- Front layout chain 1 + 6 + 1 -->
<line x1="105" y1="595" x2="180" y2="595" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="180" y1="595" x2="650" y2="595" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="650" y1="595" x2="725" y2="595" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="105" y1="570" x2="105" y2="610" class="thin"/><line x1="180" y1="510" x2="180" y2="610" class="thin"/><line x1="650" y1="510" x2="650" y2="610" class="thin"/><line x1="725" y1="570" x2="725" y2="610" class="thin"/>
<text x="125" y="625" class="s">1.00</text><text x="393" y="625" class="s">6.00</text><text x="665" y="625" class="s">1.00</text>

<!-- Weld callout -->
<line x1="810" y1="330" x2="520" y2="445" class="weld" marker-end="url(#arrow)"/>
<line x1="810" y1="330" x2="1085" y2="330" class="weld"/>
<path d="M875 330 L875 300 L905 330" class="weld"/><path d="M875 330 L875 360 L905 330" class="weld"/>
<text x="832" y="322" class="t">1/4</text><text x="940" y="322" class="t">6.00</text>
<text x="760" y="278" class="s">1/4 FILLET — BOTH SIDES — 6.00 CONT.</text>

<!-- NOTES -->
<rect x="1120" y="150" width="620" height="420" rx="8" class="note"/>
<text x="1150" y="192" class="h2">NOTES / FABRICATION REQUIREMENTS</text>
<text x="1150" y="235" class="t">1. MATERIAL: ASTM A36 STEEL.</text>
<text x="1150" y="272" class="t">2. BASE PLATE: 8.00 × 5.00 × 1/4.</text>
<text x="1150" y="309" class="t">3. VERTICAL PLATE: 6.00 × 3.00 × 1/4.</text>
<text x="1150" y="346" class="t">4. 2X Ø .375 THRU IN BASE PLATE.</text>
<text x="1150" y="383" class="t">5. DEBURR CUT EDGES AND HOLES.</text>
<text x="1150" y="420" class="t">6. FILLET WELD BOTH SIDES AS SHOWN.</text>
<text x="1150" y="457" class="t">7. VERIFY BASE SIZE, HOLE LOCATION,</text>
<text x="1176" y="486" class="t">PLATE CENTERING, AND FIT-UP BEFORE WELDING.</text>
<text x="1150" y="530" class="t">8. UNLESS OTHERWISE SHOWN: ± .03 IN.</text>

<!-- TOP VIEW -->
<text x="85" y="700" class="h2">TOP VIEW</text>
<rect x="105" y="735" width="620" height="390" class="fill"/>
<rect x="180" y="922" width="470" height="20" class="fill"/>
<line x1="415" y1="715" x2="415" y2="1145" class="center"/><line x1="85" y1="932" x2="745" y2="932" class="center"/>
<circle cx="180" cy="815" r="26" class="ln"/><circle cx="650" cy="815" r="26" class="ln"/>
<line x1="145" y1="815" x2="215" y2="815" class="center"/><line x1="180" y1="780" x2="180" y2="850" class="center"/>
<line x1="615" y1="815" x2="685" y2="815" class="center"/><line x1="650" y1="780" x2="650" y2="850" class="center"/>
<text x="235" y="790" class="t">2X Ø .375 THRU</text>

<!-- Top overall depth -->
<line x1="770" y1="735" x2="770" y2="1125" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="728" y1="735" x2="790" y2="735" class="thin"/><line x1="728" y1="1125" x2="790" y2="1125" class="thin"/>
<rect x="744" y="914" width="88" height="30" class="labelbg"/><text x="754" y="937" class="dimtxt">5.00</text>

<!-- Top hole Y location and plate centerline -->
<line x1="820" y1="735" x2="820" y2="815" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="790" y1="735" x2="838" y2="735" class="thin"/><line x1="790" y1="815" x2="838" y2="815" class="thin"/>
<text x="836" y="781" class="s">1.00</text>
<line x1="875" y1="735" x2="875" y2="932" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="845" y1="735" x2="895" y2="735" class="thin"/><line x1="845" y1="932" x2="895" y2="932" class="thin"/>
<text x="890" y="842" class="s">2.50 TO CL</text>

<!-- Top X layout chain -->
<line x1="105" y1="1165" x2="180" y2="1165" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="180" y1="1165" x2="650" y2="1165" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="650" y1="1165" x2="725" y2="1165" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="105" y1="1125" x2="105" y2="1180" class="thin"/><line x1="180" y1="850" x2="180" y2="1180" class="thin"/><line x1="650" y1="850" x2="650" y2="1180" class="thin"/><line x1="725" y1="1125" x2="725" y2="1180" class="thin"/>
<text x="120" y="1200" class="s">1.00</text><text x="392" y="1200" class="s">6.00</text><text x="665" y="1200" class="s">1.00</text>

<!-- RIGHT SIDE VIEW -->
<text x="970" y="700" class="h2">RIGHT SIDE VIEW</text>
<rect x="980" y="1087" width="390" height="38" class="fill"/>
<rect x="1165" y="855" width="20" height="232" class="fill"/>
<line x1="1175" y1="825" x2="1175" y2="1148" class="center"/><line x1="960" y1="932" x2="1390" y2="932" class="center"/>

