<text x="835" y="780" class="s">1.00</text>
<text x="235" y="790" class="t">2X Ø .375 THRU</text>
<text x="930" y="700" class="h2">RIGHT SIDE VIEW</text>
<rect x="950" y="1087" width="390" height="38" class="fill"/>
<rect x="1135" y="855" width="20" height="232" class="fill"/>
<line x1="1145" y1="825" x2="1145" y2="1148" class="center"/>
<line x1="930" y1="930" x2="1360" y2="930" class="center"/>
<line x1="950" y1="805" x2="1340" y2="805" class="dim" marker-start="url(#dimA)" marker-end="url(#dimA)"/>
<line x1="950" y1="810" x2="950" y2="1085" class="thin"/><line x1="1340" y1="810" x2="1340" y2="1085" class="thin"/>
