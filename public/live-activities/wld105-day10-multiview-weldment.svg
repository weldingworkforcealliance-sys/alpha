<line x1="728" y1="735" x2="790" y2="735" class="thin"/><line x1="728" y1="1125" x2="790" y2="1125" class="thin"/>
<rect x="748" y="915" width="75" height="30" fill="#fff"/><text x="755" y="937" class="t">5.00</text>
<line x1="105" y1="1165" x2="180" y2="1165" class="dim" marker-start="url(#dimA)" marker-end="url(#dimA)"/>
<line x1="180" y1="1165" x2="650" y2="1165" class="dim" marker-start="url(#dimA)" marker-end="url(#dimA)"/>
<line x1="650" y1="1165" x2="725" y2="1165" class="dim" marker-start="url(#dimA)" marker-end="url(#dimA)"/>
