<line x1="980" y1="810" x2="980" y2="1085" class="thin"/><line x1="1370" y1="810" x2="1370" y2="1085" class="thin"/>
<rect x="1133" y="786" width="84" height="27" class="labelbg"/><text x="1142" y="807" class="dimtxt">5.00</text>

<!-- Right-side centered layout 2.50 + 2.50 -->
<line x1="980" y1="765" x2="1175" y2="765" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="1175" y1="765" x2="1370" y2="765" class="dim" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
<line x1="980" y1="770" x2="980" y2="805" class="thin"/><line x1="1175" y1="745" x2="1175" y2="805" class="thin"/><line x1="1370" y1="770" x2="1370" y2="805" class="thin"/>
<text x="1050" y="750" class="s">2.50</text><text x="1245" y="750" class="s">2.50</text>

