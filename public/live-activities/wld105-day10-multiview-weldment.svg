<line x1="1090" y1="855" x2="1090" y2="1087" class="dim" marker-start="url(#dimA)" marker-end="url(#dimA)"/>
<text x="1040" y="980" class="s">3.00</text>
<text x="1180" y="875" class="s">VERTICAL PLATE CENTERED</text><text x="1180" y="901" class="s">ON BASE DEPTH</text>
<rect x="1120" y="150" width="620" height="420" rx="8" class="note"/>
<text x="1150" y="192" class="h2">NOTES / FABRICATION REQUIREMENTS</text>
<text x="1150" y="235" class="t">1. MATERIAL: ASTM A36 STEEL.</text>
<text x="1150" y="272" class="t">2. BASE PLATE: 8.00 × 5.00 × 1/4.</text>
<text x="1150" y="309" class="t">3. VERTICAL PLATE: 6.00 × 3.00 × 1/4.</text>
<text x="1150" y="346" class="t">4. 2X Ø .375 THRU IN BASE PLATE.</text>
<text x="1150" y="383" class="t">5. DEBURR CUT EDGES AND HOLES.</text>
<text x="1150" y="420" class="t">6. FILLET WELD BOTH SIDES AS SHOWN.</text>
<text x="1150" y="457" class="t">7. VERIFY BASE SIZE, HOLE LOCATION,</text>
<text x="1176" y="486" class="t">PLATE CENTERING, AND FIT-UP BEFORE WELDING.</text>
<text x="1150" y="530" class="t">8. UNLESS OTHERWISE SHOWN: ± .03 IN.</text>
<rect x="930" y="1160" width="810" height="82" class="thin"/>
<line x1="1190" y1="1160" x2="1190" y2="1242" class="thin"/><line x1="1445" y1="1160" x2="1445" y2="1242" class="thin"/>
<text x="945" y="1190" class="xs">DRAWING</text><text x="945" y="1220" class="s">DAY10-WELDMENT-01</text>
<text x="1205" y="1190" class="xs">TITLE</text><text x="1205" y="1220" class="s">MULTI-VIEW TRAINING WELDMENT</text>
