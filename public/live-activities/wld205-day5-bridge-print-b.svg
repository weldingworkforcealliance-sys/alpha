<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="white"/>
<rect x="30" y="30" width="1140" height="1540" fill="none" stroke="#222" stroke-width="3"/>
<g font-family="Arial" fill="#111">
<text x="60" y="80" font-size="34" font-weight="700">BRIDGE PRINT B — BRACKET-B</text>
<text x="60" y="118" font-size="20">WLD 205 Day 5 • Original PCCC/LTG training print • Units: inches • Scale: NTS</text>
<text x="60" y="155" font-size="18">Purpose: separate PRINT information from PROCEDURE information before WLD 210 physical application.</text>
</g>
<!-- front view -->
<g transform="translate(70,220)" font-family="Arial">
<text x="0" y="0" font-size="22" font-weight="700">FRONT VIEW</text>
<rect x="70" y="280" width="420" height="60" fill="#e5e5e5" stroke="#111" stroke-width="3"/>
<rect x="245" y="75" width="70" height="205" fill="#f2f2f2" stroke="#111" stroke-width="3"/>
<line x1="280" y1="55" x2="280" y2="360" stroke="#555" stroke-dasharray="28 8 7 8" stroke-width="2"/>
<text x="150" y="385" font-size="18">Base plate 6 × 4 × 1/4</text>
<text x="335" y="155" font-size="18">Vertical plate</text>
<text x="335" y="180" font-size="18">4 × 3 × 1/4</text>
<path d="M245 270 L225 250 M315 270 L335 250" stroke="#111" stroke-width="3"/>
<text x="145" y="235" font-size="18">T-joint at vertical/base intersection</text>
<!-- dimensions -->
<line x1="70" y1="405" x2="490" y2="405" stroke="#111"/><line x1="70" y1="395" x2="70" y2="420" stroke="#111"/><line x1="490" y1="395" x2="490" y2="420" stroke="#111"/>
<text x="255" y="398" font-size="18">6</text>
<line x1="520" y1="75" x2="520" y2="340" stroke="#111"/><line x1="510" y1="75" x2="535" y2="75" stroke="#111"/><line x1="510" y1="340" x2="535" y2="340" stroke="#111"/>
<text x="535" y="215" font-size="18">4</text>
</g>
<!-- side view -->
<g transform="translate(690,220)" font-family="Arial">
<text x="0" y="0" font-size="22" font-weight="700">RIGHT-SIDE VIEW</text>
<rect x="80" y="280" width="300" height="60" fill="#e5e5e5" stroke="#111" stroke-width="3"/>
<rect x="190" y="75" width="60" height="205" fill="#f2f2f2" stroke="#111" stroke-width="3"/>
<text x="70" y="390" font-size="18">Base width 4</text>
<text x="255" y="165" font-size="18">Vertical plate</text>
</g>
<!-- source split -->
<rect x="70" y="760" width="1060" height="300" rx="12" fill="#fafafa" stroke="#444" stroke-width="2"/>
<g font-family="Arial" fill="#111">
<text x="100" y="810" font-size="25" font-weight="700">DRAWING NOTE</text>
<text x="100" y="855" font-size="28" font-weight="700">WELD PER APPROVED WPS/SWPS</text>
<text x="100" y="915" font-size="21">The print defines the assembly and the weld location/information actually shown.</text>
<text x="100" y="955" font-size="21">The approved WPS/SWPS controls the welding procedure conditions assigned to the job.</text>
<text x="100" y="1000" font-size="20">Do not invent a missing weld size, machine setting, preheat/interpass value, or acceptance requirement.</text>
</g>
<rect x="70" y="1110" width="500" height="360" rx="12" fill="#f7f7f7" stroke="#555"/>
<rect x="630" y="1110" width="500" height="360" rx="12" fill="#f7f7f7" stroke="#555"/>
<g font-family="Arial" fill="#111">
<text x="100" y="1155" font-size="23" font-weight="700">FROM THE PRINT</text>
<text x="100" y="1200" font-size="19">• Part / assembly identification</text>
<text x="100" y="1240" font-size="19">• Member geometry and dimensions</text>
<text x="100" y="1280" font-size="19">• Joint / weld location actually shown</text>
<text x="100" y="1320" font-size="19">• Drawing notes and symbol information</text>
<text x="660" y="1155" font-size="23" font-weight="700">FROM APPROVED PROCEDURE</text>
<text x="660" y="1200" font-size="19">• Assigned process / procedure variables</text>
<text x="660" y="1240" font-size="19">• Required conditions cited by the WPS/SWPS</text>
<text x="660" y="1280" font-size="19">• Any procedure-specific limits or instructions</text>
<text x="660" y="1320" font-size="19">• Only values actually present in the approved source</text>
<text x="100" y="1520" font-size="18">Training print only. Exact welding-symbol conventions come from the authorized classroom reference.</text>
</g>
</svg>