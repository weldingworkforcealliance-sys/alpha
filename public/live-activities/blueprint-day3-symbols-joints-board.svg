<text x="82" y="1993" font-family="Arial" font-size="22" font-weight="700" fill="#fff">MULTIPLE REFERENCE LINES = watch for sequence or multiple welding instructions.</text>
<text x="82" y="2027" font-family="Arial" font-size="18" fill="#fff">Strong habit: match symbol details to the actual joint before welding.</text>
