<text x="85" y="560" font-family="Arial" font-size="19">ARROW → points to the joint/member</text>
<text x="1010" y="515" font-family="Arial" font-size="19">TAIL → process / spec / reference when needed</text>
<text x="300" y="352" font-family="Arial" font-size="18">ALL-AROUND CIRCLE</text>
<text x="300" y="382" font-family="Arial" font-size="18">FIELD-WELD FLAG</text>
<text x="500" y="500" font-family="Arial" font-size="18">Basic symbol sits on reference line</text>
<g font-family="Arial, Helvetica, sans-serif" fill="#111">
<rect x="55" y="710" width="1290" height="500" rx="14" fill="#f7f7f7" stroke="#555" stroke-width="2"/>
<text x="82" y="753" font-size="28" font-weight="700">2 · SIDE, SIZE, LENGTH, AND PITCH</text>
<text x="82" y="786" font-size="18">Below the line = arrow side. Above the line = other side.</text>
</g>
<rect x="85" y="835" width="365" height="300" rx="12" fill="#fff" stroke="#777" stroke-width="2"/>
<text x="110" y="872" font-family="Arial" font-size="21" font-weight="700">ARROW SIDE</text>
