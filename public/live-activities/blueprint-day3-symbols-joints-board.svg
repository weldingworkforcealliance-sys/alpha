<text x="60" y="82" font-size="38" font-weight="700">BLUEPRINT READING — DAY 3</text>
<text x="60" y="122" font-size="23">Welding Symbols + Basic Joints • LTG Training Board</text>
<text x="60" y="154" font-size="17" fill="#555">Training graphics support the lesson. Authorized welding-symbol references remain controlling.</text>

<rect x="55" y="195" width="1290" height="480" rx="14" fill="#f7f7f7" stroke="#555" stroke-width="2"/>
<text x="82" y="238" font-size="28" font-weight="700">1 · ANATOMY OF A WELDING SYMBOL</text>
<text x="82" y="272" font-size="18">Read the whole symbol before making a fit-up or tack decision.</text>
</g>
<line x1="235" y1="410" x2="1030" y2="410" stroke="#111" stroke-width="5"/>
