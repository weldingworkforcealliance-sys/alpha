<line x1="145" y1="975" x2="110" y2="1020" stroke="#111" stroke-width="4"/>
<polygon points="235,975 265,975 250,1007" fill="none" stroke="#111" stroke-width="4"/>
<text x="135" y="1080" font-family="Arial" font-size="18">Symbol BELOW reference line</text>
<rect x="515" y="835" width="365" height="300" rx="12" fill="#fff" stroke="#777" stroke-width="2"/>
<text x="540" y="872" font-family="Arial" font-size="21" font-weight="700">OTHER SIDE</text>
<line x1="575" y1="975" x2="815" y2="975" stroke="#111" stroke-width="4"/>
<line x1="575" y1="975" x2="540" y2="1020" stroke="#111" stroke-width="4"/>
<polygon points="665,975 695,975 680,943" fill="none" stroke="#111" stroke-width="4"/>
<text x="565" y="1080" font-family="Arial" font-size="18">Symbol ABOVE reference line</text>
<rect x="945" y="835" width="365" height="300" rx="12" fill="#fff" stroke="#777" stroke-width="2"/>
<text x="970" y="872" font-family="Arial" font-size="21" font-weight="700">SIZE / LENGTH / PITCH</text>
<line x1="1000" y1="975" x2="1255" y2="975" stroke="#111" stroke-width="4"/>
<line x1="1000" y1="975" x2="965" y2="1020" stroke="#111" stroke-width="4"/>
<text x="1015" y="1035" font-family="Arial" font-size="28">1/4</text>
<polygon points="1095,975 1125,975 1110,1007" fill="none" stroke="#111" stroke-width="4"/>
<text x="1150" y="1035" font-family="Arial" font-size="28">2-6</text>
<text x="985" y="1090" font-family="Arial" font-size="17">LEFT = weld size</text>
<text x="1140" y="1090" font-family="Arial" font-size="17">RIGHT = length-pitch</text>
<g font-family="Arial, Helvetica, sans-serif" fill="#111">
<rect x="55" y="1245" width="1290" height="680" rx="14" fill="#f7f7f7" stroke="#555" stroke-width="2"/>
<text x="82" y="1288" font-size="28" font-weight="700">3 · FIVE BASIC JOINT TYPES</text>
<text x="82" y="1320" font-size="18">Name the joint before deciding what weld belongs there.</text>
</g>
