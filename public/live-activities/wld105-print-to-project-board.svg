<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><rect width="1800" height="1200" fill="white"/><rect x="18" y="18" width="1764" height="1164" fill="none" stroke="#111" stroke-width="4"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.h1{font-size:42px;font-weight:700}.h2{font-size:28px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.ln{stroke:#111;stroke-width:4;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.dash{stroke:#666;stroke-width:2;stroke-dasharray:14 10;fill:none}.box{fill:#f8f8f8;stroke:#444;stroke-width:2}</style><text x="55" y="78" class="h1">WLD 105 PRINT-TO-PROJECT BOARD — DAYS 10–13</text><text x="55" y="118" class="t">Multi-view reading • fabrication requirements • cut list • QC • exam review</text>
<rect x="55" y="155" width="1020" height="600" rx="12" class="box"/><text x="85" y="198" class="h2">A. TRAINING WELDMENT — READ ALL SOURCES TOGETHER</text><text x="100" y="245" class="t">FRONT VIEW</text><rect x="100" y="280" width="400" height="260" class="ln"/><rect x="145" y="435" width="310" height="55" class="ln"/><line x1="300" y1="300" x2="300" y2="520" class="dash"/><circle cx="200" cy="350" r="28" class="ln"/><circle cx="400" cy="350" r="28" class="ln"/><text x="580" y="245" class="t">TOP VIEW</text><rect x="570" y="280" width="400" height="210" class="ln"/><rect x="620" y="325" width="300" height="120" class="ln"/><line x1="770" y1="290" x2="770" y2="480" class="dash"/>
<line x1="145" y1="585" x2="455" y2="585" class="thin"/><line x1="145" y1="555" x2="145" y2="610" class="thin"/><line x1="455" y1="555" x2="455" y2="610" class="thin"/><text x="250" y="575" class="t">8.00 ± .03</text><line x1="520" y1="280" x2="520" y2="540" class="thin"/><text x="540" y="420" class="t">5.00</text>
<text x="110" y="650" class="t">NOTES:</text><text x="220" y="650" class="t">1) Material: 1/4 in steel plate</text><text x="220" y="690" class="t">2) 2X Ø .375 THRU</text><text x="220" y="730" class="t">3) Deburr; verify size before fit-up</text>
<rect x="1120" y="155" width="625" height="600" rx="12" class="box"/><text x="1150" y="198" class="h2">B. REQUIREMENTS CHECK</text><text x="1160" y="255" class="t">Before cutting, answer:</text><text x="1180" y="310" class="t">• What gets made?</text><text x="1180" y="355" class="t">• From what material?</text><text x="1180" y="400" class="t">• To what size/tolerance?</text><text x="1180" y="445" class="t">• Which holes/features?</text><text x="1180" y="490" class="t">• Which weld information?</text><text x="1180" y="535" class="t">• What must be inspected?</text><text x="1160" y="610" class="s">Use title block, views, dimensions, notes, weld symbols, and general tolerances. A correct answer must point to evidence on the print.</text>
<rect x="55" y="790" width="1020" height="330" rx="12" class="box"/><text x="85" y="835" class="h2">C. CUT LIST</text><rect x="100" y="875" width="920" height="185" class="thin"/><line x1="100" y1="925" x2="1020" y2="925" class="thin"/><line x1="180" y1="875" x2="180" y2="1060" class="thin"/><line x1="400" y1="875" x2="400" y2="1060" class="thin"/><line x1="620" y1="875" x2="620" y2="1060" class="thin"/><line x1="820" y1="875" x2="820" y2="1060" class="thin"/><text x="120" y="910" class="s">QTY</text><text x="225" y="910" class="s">MATERIAL</text><text x="455" y="910" class="s">SIZE</text><text x="665" y="910" class="s">FEATURE</text><text x="860" y="910" class="s">QC</text><text x="120" y="980" class="t">1</text><text x="215" y="980" class="t">1/4 in steel</text><text x="435" y="980" class="t">8.00 × 5.00</text><text x="655" y="980" class="t">2 holes</text><text x="850" y="980" class="t">measure</text><text x="100" y="1095" class="s">A usable cut list includes quantity, material, dimensions, units, required features, and a checkpoint before material is committed.</text>
<rect x="1120" y="790" width="625" height="330" rx="12" class="box"/><text x="1150" y="835" class="h2">D. REVIEW / EXAM HABITS</text><text x="1160" y="895" class="t">1. Identify the controlling source.</text><text x="1160" y="940" class="t">2. Read notes before calculating.</text><text x="1160" y="985" class="t">3. Transfer features across views.</text><text x="1160" y="1030" class="t">4. Check units and tolerances.</text><text x="1160" y="1075" class="t">5. Verify symbol side and callout.</text></svg>