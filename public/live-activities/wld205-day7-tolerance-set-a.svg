<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700">
<rect width="1200" height="1700" fill="white"/>
<rect x="30" y="30" width="1140" height="1640" fill="none" stroke="#222" stroke-width="3"/>
<g font-family="Arial" fill="#111">
<text x="60" y="82" font-size="34" font-weight="700">WLD 205 DAY 7 — TOLERANCE SET A</text>
<text x="60" y="120" font-size="20">For every case: write lower limit, upper limit, actual value, units, then ACCEPT or REJECT.</text>
</g>
<g font-family="Arial" font-size="18" fill="#111">
<text x="75" y="185" font-size="20" font-weight="700">Case</text><text x="165" y="185" font-size="20" font-weight="700">Nominal / Tolerance</text><text x="475" y="185" font-size="20" font-weight="700">Actual</text><text x="625" y="185" font-size="20" font-weight="700">Lower</text><text x="775" y="185" font-size="20" font-weight="700">Upper</text><text x="925" y="185" font-size="20" font-weight="700">Decision</text>
</g>
<g stroke="#555" fill="none">
<rect x="60" y="205" width="1080" height="900"/>
<line x1="145" y1="205" x2="145" y2="1105"/><line x1="455" y1="205" x2="455" y2="1105"/><line x1="605" y1="205" x2="605" y2="1105"/><line x1="755" y1="205" x2="755" y2="1105"/><line x1="905" y1="205" x2="905" y2="1105"/>
<line x1="60" y1="355" x2="1140" y2="355"/><line x1="60" y1="505" x2="1140" y2="505"/><line x1="60" y1="655" x2="1140" y2="655"/><line x1="60" y1="805" x2="1140" y2="805"/><line x1="60" y1="955" x2="1140" y2="955"/>
</g>
<g font-family="Arial" fill="#111" font-size="21">
<text x="90" y="285">1</text><text x="175" y="275">2.000 ± 0.030 in</text><text x="490" y="275">2.025 in</text>
<text x="90" y="435">2</text><text x="175" y="425">2.000 ± 0.030 in</text><text x="490" y="425">2.036 in</text>
<text x="90" y="585">3</text><text x="175" y="575">6.500 ± 0.015 in</text><text x="490" y="575">6.490 in</text>
<text x="90" y="735">4</text><text x="175" y="725">6.500 ± 0.015 in</text><text x="490" y="725">6.518 in</text>
<text x="90" y="885">5</text><text x="175" y="875">1.500 ± 0.020 in</text><text x="490" y="875">1.481 in</text>
<text x="90" y="1035">6</text><text x="175" y="1025">1.500 ± 0.020 in</text><text x="490" y="1025">1.477 in</text>
</g>
<rect x="60" y="1160" width="1080" height="420" rx="14" fill="#fafafa" stroke="#444"/>
<g font-family="Arial" fill="#111">
<text x="90" y="1210" font-size="24" font-weight="700">Required reasoning</text>
<text x="90" y="1260" font-size="21">1. Calculate lower limit = nominal − tolerance.</text>
<text x="90" y="1310" font-size="21">2. Calculate upper limit = nominal + tolerance.</text>
<text x="90" y="1360" font-size="21">3. Compare the actual measurement to BOTH limits.</text>
<text x="90" y="1410" font-size="21">4. If actual is within the stated limits, ACCEPT. If outside either limit, REJECT / HOLD for correction-recheck.</text>
<text x="90" y="1460" font-size="21">5. Never round an out-of-tolerance value into acceptance.</text>
<text x="90" y="1510" font-size="21">6. Keep the original measurement and units in the record.</text>
</g>
</svg>