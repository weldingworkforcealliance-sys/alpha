<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700">
<rect width="1200" height="1700" fill="white"/>
<text x="60" y="70" font-family="Arial" font-size="34" font-weight="700">WLD 205 DAY 5 — SYMBOL-TO-JOINT CARDS</text>
<text x="60" y="108" font-family="Arial" font-size="20">Original classroom practice set • Authorized PCCC/AWS symbol reference remains controlling.</text>
<g font-family="Arial">
<g transform="translate(55,150)"><rect width="520" height="310" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/><text x="25" y="40" font-size="22" font-weight="700">CARD 1 — JOINT FIRST</text><rect x="80" y="170" width="280" height="35" fill="#ddd" stroke="#111" stroke-width="3"/><rect x="200" y="90" width="35" height="115" fill="#eee" stroke="#111" stroke-width="3"/><text x="25" y="245" font-size="18">Name the joint type. Where is the intersection?</text><text x="25" y="275" font-size="18">What information is still needed before welding?</text></g>
<g transform="translate(625,150)"><rect width="520" height="310" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/><text x="25" y="40" font-size="22" font-weight="700">CARD 2 — ARROW-SIDE PRACTICE</text><line x1="80" y1="145" x2="420" y2="145" stroke="#111" stroke-width="3"/><line x1="80" y1="145" x2="35" y2="210" stroke="#111" stroke-width="3"/><polygon points="200,145 225,145 212,120" fill="none" stroke="#111" stroke-width="3"/><text x="25" y="245" font-size="18">Use the authorized reference.</text><text x="25" y="275" font-size="18">Identify the side/location shown.</text></g>
<g transform="translate(55,495)"><rect width="520" height="310" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/><text x="25" y="40" font-size="22" font-weight="700">CARD 3 — OTHER-SIDE PRACTICE</text><line x1="80" y1="145" x2="420" y2="145" stroke="#111" stroke-width="3"/><line x1="80" y1="145" x2="35" y2="210" stroke="#111" stroke-width="3"/><polygon points="200,145 225,145 212,170" fill="none" stroke="#111" stroke-width="3"/><text x="25" y="245" font-size="18">Use the authorized reference.</text><text x="25" y="275" font-size="18">Identify the side/location shown.</text></g>
<g transform="translate(625,495)"><rect width="520" height="310" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/><text x="25" y="40" font-size="22" font-weight="700">CARD 4 — SIZE INFORMATION</text><line x1="80" y1="145" x2="420" y2="145" stroke="#111" stroke-width="3"/><line x1="80" y1="145" x2="35" y2="210" stroke="#111" stroke-width="3"/><text x="155" y="125" font-size="28">1/4</text><polygon points="225,145 250,145 237,120" fill="none" stroke="#111" stroke-width="3"/><text x="25" y="245" font-size="18">What kind of information is shown left of the symbol?</text><text x="25" y="275" font-size="18">Do not infer any unshown procedure value.</text></g>
<g transform="translate(55,840)"><rect width="520" height="310" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/><text x="25" y="40" font-size="22" font-weight="700">CARD 5 — TAIL / SOURCE</text><line x1="80" y1="145" x2="350" y2="145" stroke="#111" stroke-width="3"/><line x1="80" y1="145" x2="35" y2="210" stroke="#111" stroke-width="3"/><line x1="350" y1="145" x2="410" y2="110" stroke="#111" stroke-width="3"/><line x1="350" y1="145" x2="410" y2="180" stroke="#111" stroke-width="3"/><text x="285" y="95" font-size="18">SEE APPROVED</text><text x="300" y="118" font-size="18">WPS/SWPS</text><text x="25" y="245" font-size="18">What should the welder do next?</text><text x="25" y="275" font-size="18">Identify the controlling source before setup.</text></g>
<g transform="translate(625,840)"><rect width="520" height="310" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/><text x="25" y="40" font-size="22" font-weight="700">CARD 6 — MISSING INFORMATION</text><rect x="85" y="175" width="280" height="35" fill="#ddd" stroke="#111" stroke-width="3"/><rect x="205" y="95" width="35" height="115" fill="#eee" stroke="#111" stroke-width="3"/><text x="25" y="245" font-size="18">No weld size is supplied on this practice card.</text><text x="25" y="275" font-size="18">What size should you use?</text></g>
</g>
<rect x="55" y="1205" width="1090" height="410" rx="14" fill="#f7f7f7" stroke="#555"/>
<g font-family="Arial" fill="#111">
<text x="85" y="1250" font-size="24" font-weight="700">STUDENT RULE</text>
<text x="85" y="1295" font-size="21">Identify → Find the source → Read only what is specified → Stop when information is missing.</text>
<text x="85" y="1360" font-size="21" font-weight="700">Do not invent:</text>
<text x="110" y="1400" font-size="20">• weld size • process • amperage • voltage • travel speed • preheat/interpass • acceptance value</text>
<text x="85" y="1470" font-size="20">Exact welding-symbol meaning is controlled by the authorized classroom reference.</text>
<text x="85" y="1520" font-size="20">Procedure conditions are controlled by the approved WPS/SWPS or other assigned authorized source.</text>
</g>
</svg>