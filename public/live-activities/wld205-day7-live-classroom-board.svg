<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="3300" viewBox="0 0 1400 3300">
<rect width="1400" height="3300" fill="white"/>
<rect x="30" y="30" width="1340" height="3240" fill="none" stroke="#222" stroke-width="3"/>
<g font-family="Arial" fill="#111">
<text x="60" y="90" font-size="38" font-weight="700">WLD 205 PVHS DAY 7 — TOLERANCES + ACCEPT / REJECT</text>
<text x="60" y="135" font-size="22">Live Classroom Board · NOMINAL → LIMITS → ACTUAL → DECISION → DOCUMENT</text>
<text x="60" y="175" font-size="20">Use this one board with Live Questions 1–15. Real job tolerances always come from the approved print / tolerance source.</text>
</g>
<rect x="55" y="215" width="1290" height="760" rx="16" fill="#fafafa" stroke="#555" stroke-width="2"/>
<g font-family="Arial" fill="#111"><text x="80" y="265" font-size="30" font-weight="700">STEP 1 · 0–8 MIN — FIND THE LIMITS · LIVE QUESTIONS 1–3</text><text x="80" y="310" font-size="20">Calculate lower and upper limits first. Keep units.</text><rect x="85" y="350" width="1230" height="165" rx="12" fill="white" stroke="#777"/><text x="110" y="395" font-size="23" font-weight="700">CARD A</text><text x="310" y="395" font-size="34" font-weight="700">2.000 ± 0.030 in</text><text x="110" y="455" font-size="21">Lower limit: __________   Upper limit: __________</text><rect x="85" y="535" width="1230" height="165" rx="12" fill="white" stroke="#777"/><text x="110" y="580" font-size="23" font-weight="700">CARD B</text><text x="310" y="580" font-size="34" font-weight="700">6.500 ± 0.015 in</text><text x="110" y="640" font-size="21">Lower limit: __________   Upper limit: __________</text><rect x="85" y="720" width="1230" height="205" rx="12" fill="white" stroke="#777"/><text x="110" y="765" font-size="23" font-weight="700">CARD C</text><text x="310" y="765" font-size="34" font-weight="700">1 1/2 ± 1/32 in</text><text x="110" y="825" font-size="21">Rewrite 1 1/2 in thirty-seconds, then calculate both limits.</text><text x="110" y="875" font-size="21">Lower limit: __________   Upper limit: __________</text></g>
<rect x="55" y="1015" width="1290" height="980" rx="16" fill="#fafafa" stroke="#555" stroke-width="2"/>
<g font-family="Arial" fill="#111"><text x="80" y="1065" font-size="30" font-weight="700">STEP 2–3 · 8–40 MIN — COMPARE ACTUALS · LIVE QUESTIONS 4–9</text><text x="80" y="1110" font-size="20">For every case: calculate both limits, compare the actual to both, then ACCEPT or REJECT.</text><text x="80" y="1170" font-size="20" font-weight="700">Case</text><text x="180" y="1170" font-size="20" font-weight="700">Nominal / Tolerance</text><text x="530" y="1170" font-size="20" font-weight="700">Actual</text><text x="710" y="1170" font-size="20" font-weight="700">Lower</text><text x="870" y="1170" font-size="20" font-weight="700">Upper</text><text x="1030" y="1170" font-size="20" font-weight="700">Decision</text></g>
<g stroke="#777" fill="white"><rect x="75" y="1195" width="1250" height="570"/><line x1="155" y1="1195" x2="155" y2="1765"/><line x1="500" y1="1195" x2="500" y2="1765"/><line x1="680" y1="1195" x2="680" y2="1765"/><line x1="840" y1="1195" x2="840" y2="1765"/><line x1="1000" y1="1195" x2="1000" y2="1765"/><line x1="75" y1="1290" x2="1325" y2="1290"/><line x1="75" y1="1385" x2="1325" y2="1385"/><line x1="75" y1="1480" x2="1325" y2="1480"/><line x1="75" y1="1575" x2="1325" y2="1575"/><line x1="75" y1="1670" x2="1325" y2="1670"/></g>
<g font-family="Arial" fill="#111" font-size="20"><text x="105" y="1255">1</text><text x="180" y="1255">2.000 ± 0.030 in</text><text x="535" y="1255">2.025 in</text><text x="105" y="1350">2</text><text x="180" y="1350">2.000 ± 0.030 in</text><text x="535" y="1350">2.036 in</text><text x="105" y="1445">3</text><text x="180" y="1445">6.500 ± 0.015 in</text><text x="535" y="1445">6.490 in</text><text x="105" y="1540">4</text><text x="180" y="1540">6.500 ± 0.015 in</text><text x="535" y="1540">6.518 in</text><text x="105" y="1635">5</text><text x="180" y="1635">1.500 ± 0.020 in</text><text x="535" y="1635">1.481 in</text><text x="105" y="1730">6</text><text x="180" y="1730">1.500 ± 0.020 in</text><text x="535" y="1730">1.477 in</text><text x="85" y="1825" font-size="22" font-weight="700">Required reasoning</text><text x="105" y="1870" font-size="20">1. Lower = nominal − tolerance.  2. Upper = nominal + tolerance.  3. Compare actual to BOTH limits.</text><text x="105" y="1910" font-size="20">4. Within limits = ACCEPT. Outside either limit = REJECT / HOLD for correction-recheck.</text><text x="105" y="1950" font-size="20">Never round an out-of-tolerance value into acceptance. Preserve the original measurement and units.</text></g>
<rect x="55" y="2035" width="1290" height="950" rx="16" fill="#fafafa" stroke="#555" stroke-width="2"/>
<g font-family="Arial" fill="#111"><text x="80" y="2085" font-size="30" font-weight="700">STEP 3 · 40–54 MIN — DOCUMENT THE DECISION · LIVE QUESTIONS 10–11</text><text x="80" y="2130" font-size="20">Identify the out-of-tolerance record, preserve the original measurement, and write a factual recheck note.</text><text x="90" y="2200" font-size="20" font-weight="700">ID</text><text x="180" y="2200" font-size="20" font-weight="700">Requirement</text><text x="525" y="2200" font-size="20" font-weight="700">Actual</text><text x="710" y="2200" font-size="20" font-weight="700">Limits</text><text x="990" y="2200" font-size="20" font-weight="700">Decision</text></g>
<g stroke="#777" fill="white"><rect x="75" y="2225" width="1250" height="300"/><line x1="155" y1="2225" x2="155" y2="2525"/><line x1="500" y1="2225" x2="500" y2="2525"/><line x1="680" y1="2225" x2="680" y2="2525"/><line x1="960" y1="2225" x2="960" y2="2525"/><line x1="75" y1="2325" x2="1325" y2="2325"/><line x1="75" y1="2425" x2="1325" y2="2425"/></g>
<g font-family="Arial" fill="#111" font-size="21"><text x="105" y="2290">A</text><text x="180" y="2290">4.000 ± 0.010 in</text><text x="525" y="2290">4.002 in</text><text x="710" y="2290">________ to ________</text><text x="990" y="2290">__________</text><text x="105" y="2390">B</text><text x="180" y="2390">8.000 ± 0.010 in</text><text x="525" y="2390">7.984 in</text><text x="710" y="2390">________ to ________</text><text x="990" y="2390">__________</text><text x="105" y="2490">C</text><text x="180" y="2490">2.500 ± 0.008 in</text><text x="525" y="2490">2.496 in</text><text x="710" y="2490">________ to ________</text><text x="990" y="2490">__________</text><text x="85" y="2595" font-size="24" font-weight="700">Corrective / Recheck Note</text><text x="105" y="2640" font-size="20">Dimension ____ measured __________ in.</text><text x="105" y="2680" font-size="20">Required limits: __________ to __________ in.</text><text x="105" y="2720" font-size="20">Actual is __________ the lower / upper limit.</text><text x="105" y="2760" font-size="20">Action: HOLD for correction/recheck per instructor/project procedure.</text><text x="85" y="2825" font-size="18">Do not erase the original measurement, change the tolerance to fit the part, or write “close enough.”</text><text x="85" y="2860" font-size="18">Physical correction follows applicable WLD 210 / instructor / project controls.</text></g>
<rect x="55" y="3025" width="1290" height="190" rx="16" fill="#f4f4f4" stroke="#555" stroke-width="2"/>
<g font-family="Arial" fill="#111"><text x="80" y="3075" font-size="28" font-weight="700">STEP 4 · 54–60 MIN — INDEPENDENT EXIT CHECK · LIVE QUESTIONS 12–15</text><text x="80" y="3125" font-size="21">No coaching. Questions 12–14 check accept/reject reasoning. Question 15 checks the full decision chain.</text><text x="80" y="3170" font-size="20" font-weight="700">Standing rule: NOMINAL → LIMITS → ACTUAL → DECISION → DOCUMENT when action is required.</text></g>
</svg>