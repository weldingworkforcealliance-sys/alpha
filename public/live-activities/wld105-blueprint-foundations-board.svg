<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><rect width="1800" height="1200" fill="white"/><rect x="18" y="18" width="1764" height="1164" fill="none" stroke="#111" stroke-width="4"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.h1{font-size:42px;font-weight:700}.h2{font-size:28px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.ln{stroke:#111;stroke-width:4;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.dash{stroke:#666;stroke-width:2;stroke-dasharray:14 10;fill:none}.box{fill:#f8f8f8;stroke:#444;stroke-width:2}</style><text x="55" y="78" class="h1">WLD 105 BLUEPRINT FOUNDATIONS — DAYS 3–4</text><text x="55" y="118" class="t">Title block • views • dimensions • tolerances • notes • basic weld-symbol anatomy</text><rect x="55" y="155" width="800" height="440" rx="12" class="box"/><text x="85" y="198" class="h2">1. START WITH THE TITLE BLOCK</text><rect x="110" y="245" width="690" height="250" class="thin"/><line x1="110" y1="305" x2="800" y2="305" class="thin"/><line x1="500" y1="245" x2="500" y2="495" class="thin"/><text x="135" y="285" class="t">PART: TRAINING BRACKET</text><text x="525" y="285" class="t">REV: B</text><text x="135" y="350" class="t">MATERIAL: 1/4 in STEEL</text><text x="525" y="350" class="t">QTY: 2</text><text x="135" y="415" class="t">UNLESS NOTED: ± .03 in</text><text x="525" y="415" class="t">DO NOT SCALE</text><text x="95" y="545" class="s">Before fabrication, verify part name, material, quantity, revision, general tolerance, and special notes.</text><rect x="900" y="155" width="845" height="440" rx="12" class="box"/><text x="930" y="198" class="h2">2. READ THE VIEWS TOGETHER</text><text x="950" y="250" class="t">FRONT</text><rect x="950" y="275" width="220" height="165" class="ln"/><circle cx="1060" cy="358" r="35" class="ln"/><text x="1240" y="250" class="t">TOP</text><rect x="1230" y="275" width="220" height="165" class="ln"/><rect x="1290" y="315" width="100" height="85" class="ln"/><text x="1510" y="250" class="t">RIGHT</text><rect x="1510" y="275" width="150" height="165" class="ln"/><line x1="1060" y1="285" x2="1060" y2="430" class="dash"/><line x1="970" y1="358" x2="1150" y2="358" class="dash"/><text x="930" y="500" class="t">Use alignment to transfer features. Never read one view in isolation when another view controls the shape.</text><rect x="55" y="630" width="800" height="480" rx="12" class="box"/><text x="85" y="673" class="h2">3. DIMENSIONS + TOLERANCES</text><rect x="130" y="760" width="420" height="210" class="ln"/><line x1="130" y1="720" x2="550" y2="720" class="thin"/><line x1="130" y1="700" x2="130" y2="745" class="thin"/><line x1="550" y1="700" x2="550" y2="745" class="thin"/><text x="290" y="710" class="t">6.00 ± .03</text><line x1="590" y1="760" x2="590" y2="970" class="thin"/><line x1="575" y1="760" x2="615" y2="760" class="thin"/><line x1="575" y1="970" x2="615" y2="970" class="thin"/><text x="620" y="875" class="t">3.00</text><circle cx="340" cy="865" r="48" class="ln"/><line x1="340" y1="800" x2="340" y2="930" class="dash"/><line x1="270" y1="865" x2="410" y2="865" class="dash"/><text x="180" y="1035" class="t">A tolerance defines allowed variation. Dimensions control size/location. Do not scale the picture.</text><rect x="900" y="630" width="845" height="480" rx="12" class="box"/><text x="930" y="673" class="h2">4. BASIC WELD-SYMBOL ANATOMY</text><line x1="1010" y1="820" x2="1510" y2="820" class="ln"/><line x1="1010" y1="820" x2="930" y2="900" class="ln"/><polygon points="930,900 950,865 965,885" fill="#111"/><line x1="1510" y1="820" x2="1630" y2="780" class="ln"/><path d="M1180 820 l35 -35 l35 35" class="ln"/><text x="1080" y="770" class="t">reference line</text><text x="900" y="950" class="t">arrow</text><text x="1510" y="750" class="t">tail</text><text x="1180" y="885" class="t">weld symbol</text><text x="980" y="1010" class="t">Symbol below reference line = arrow side. Above = other side.</text><text x="980" y="1050" class="s">Read size, length, pitch, contour, finish, process or specification only when shown. Never assume missing information.</text></svg>