<text x="55" y="70" font-family="Arial" font-size="34" font-weight="700">WLD 205 DAY 9 — INTEGRATED READINESS</text>
<text x="55" y="108" font-family="Arial" font-size="21">Blueprint + Math + Material Behavior</text>
<rect x="50" y="150" width="1100" height="300" rx="10" fill="#f7f7f7" stroke="#555"/><text x="72" y="188" font-family="Arial" font-size="24" font-weight="700">Quick Check — 9 Items</text><text x="85" y="235" font-family="Arial" font-size="22">3 Blueprint/source • 3 Math/tolerance • 3 Material-behavior</text>
<text x="85" y="285" font-family="Arial" font-size="22">Use the live results to assign ONE mini-station by actual need.</text>
<text x="85" y="335" font-family="Arial" font-size="22">Do not make a student repeat a strong domain.</text><rect x="50" y="475" width="1100" height="240" rx="10" fill="#f7f7f7" stroke="#555"/><text x="72" y="513" font-family="Arial" font-size="24" font-weight="700">Mini-Stations — Pause Device</text><text x="85" y="555" font-family="Arial" font-size="21">Blueprint Locate: units, material note, two dimensions on BASE-C.</text>
<text x="85" y="601" font-family="Arial" font-size="21">Math Measure: 7/16 → decimal; test 2.000 ± 0.015 at actual 1.986.</text>
<text x="85" y="647" font-family="Arial" font-size="21">Material Behavior: explain why hardness and toughness are not interchangeable.</text><rect x="50" y="740" width="1100" height="500" rx="10" fill="#f7f7f7" stroke="#555"/><text x="72" y="778" font-family="Arial" font-size="24" font-weight="700">Bridge Print C — BASE-C</text><rect x="170" y="890" width="760" height="250" fill="none" stroke="#111" stroke-width="4"/><rect x="535" y="810" width="30" height="330" fill="#eeeeee" stroke="#111" stroke-width="3"/><text x="455" y="870" font-family="Arial" font-size="22">CENTER = 5.000 in</text><text x="400" y="1180" font-family="Arial" font-size="22">10.000 in × 6.000 in plate</text><text x="145" y="1270" font-family="Arial" font-size="20">Tab location tolerance: ±0.030 in</text>
<text x="145" y="1308" font-family="Arial" font-size="20">Material: carbon steel — exact grade per instructor-issued material record</text>
<text x="145" y="1346" font-family="Arial" font-size="20">WELD PER APPROVED WPS/SWPS</text><rect x="50" y="1390" width="1100" height="220" rx="10" fill="#f7f7f7" stroke="#555"/><text x="72" y="1428" font-family="Arial" font-size="24" font-weight="700">Readiness Close</text><text x="85" y="1470" font-family="Arial" font-size="22">Record one strength + one support need.</text>
<text x="85" y="1514" font-family="Arial" font-size="22">Day 10: full WLD-210 overlap. Common WLD-205 starts Day 11.</text>
<text x="85" y="1558" font-family="Arial" font-size="22">This is readiness evidence, not a class ranking.</text>
