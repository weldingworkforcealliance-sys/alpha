<text x="85" y="326" font-family="Arial" font-size="22">Model: 3/8 and 1 7/16 → decimal. Then reverse one decimal to a common fraction.</text><rect x="50" y="500" width="1100" height="330" rx="10" fill="#f7f7f7" stroke="#555"/><text x="72" y="538" font-family="Arial" font-size="24" font-weight="700">Decimal Shop Set A</text><text x="85" y="575" font-family="Arial" font-size="22">A1  2.375 + 1.625</text>
