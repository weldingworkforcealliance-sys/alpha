<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1900" viewBox="0 0 1400 1900">
  <rect width="1400" height="1900" fill="#ffffff"/>
  <rect x="24" y="24" width="1352" height="1852" rx="14" fill="none" stroke="#222" stroke-width="3"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="60" y="78" font-size="38" font-weight="700">WLD 205 DAY 5 — WELD SYMBOLS IN 4 STEPS</text>
    <text x="60" y="118" font-size="21">PVHS Level II • Live Classroom Visual Board</text>
    <text x="60" y="150" font-size="17" fill="#555">Training graphics only. Authorized PCCC/AWS symbol reference and approved WPS/SWPS remain controlling.</text>
  </g>

  <rect x="55" y="190" width="1290" height="505" rx="14" fill="#f7f7f7" stroke="#555" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="82" y="235" font-size="28" font-weight="700">STEP 1 · NAME THE JOINT</text>
    <text x="82" y="270" font-size="19">Use Questions 1–5. Identify the relationship between the members. Do not name a weld unless one is actually specified.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke="#111" stroke-width="3">
    <rect x="85" y="305" width="375" height="155" rx="12" fill="#fff"/>
    <rect x="512" y="305" width="375" height="155" rx="12" fill="#fff"/>
    <rect x="940" y="305" width="375" height="155" rx="12" fill="#fff"/>
    <rect x="300" y="495" width="375" height="155" rx="12" fill="#fff"/>
    <rect x="725" y="495" width="375" height="155" rx="12" fill="#fff"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="105" y="338" font-size="20" font-weight="700">JOINT 1</text>
    <text x="532" y="338" font-size="20" font-weight="700">JOINT 2</text>
    <text x="960" y="338" font-size="20" font-weight="700">JOINT 3</text>
    <text x="320" y="528" font-size="20" font-weight="700">JOINT 4</text>
    <text x="745" y="528" font-size="20" font-weight="700">JOINT 5</text>
  </g>

  <rect x="135" y="382" width="125" height="38" fill="#d8d8d8" stroke="#111" stroke-width="3"/>
  <rect x="270" y="382" width="125" height="38" fill="#ececec" stroke="#111" stroke-width="3"/>
  <rect x="585" y="394" width="190" height="38" fill="#d8d8d8" stroke="#111" stroke-width="3"/>
  <rect x="650" y="365" width="190" height="38" fill="#ececec" stroke="#111" stroke-width="3"/>
  <rect x="1010" y="405" width="220" height="35" fill="#d8d8d8" stroke="#111" stroke-width="3"/>
  <rect x="1100" y="350" width="35" height="90" fill="#ececec" stroke="#111" stroke-width="3"/>
  <rect x="365" y="590" width="190" height="35" fill="#d8d8d8" stroke="#111" stroke-width="3"/>
  <rect x="520" y="540" width="35" height="85" fill="#ececec" stroke="#111" stroke-width="3"/>
  <rect x="860" y="550" width="35" height="75" fill="#d8d8d8" stroke="#111" stroke-width="3"/>
  <rect x="905" y="550" width="35" height="75" fill="#ececec" stroke="#111" stroke-width="3"/>

  <rect x="55" y="730" width="1290" height="565" rx="14" fill="#f7f7f7" stroke="#555" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="82" y="775" font-size="28" font-weight="700">STEP 2 · READ THE SYMBOL</text>
    <text x="82" y="810" font-size="19">Reading order: ARROW → REFERENCE LINE → BASIC SYMBOL → SIDE / LOCATION → SIZE / LENGTH → TAIL / NOTES</text>
    <text x="82" y="842" font-size="17" fill="#555">Use the authorized classroom reference for exact meaning. The drawings below are practice prompts, not the governing standard.</text>
  </g>

  <g stroke="#111" stroke-width="3" fill="#fff">
    <rect x="85" y="885" width="385" height="170" rx="12"/>
    <rect x="507" y="885" width="385" height="170" rx="12"/>
    <rect x="930" y="885" width="385" height="170" rx="12"/>
    <rect x="295" y="1090" width="810" height="155" rx="12"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="105" y="918" font-size="19" font-weight="700">EXAMPLE A · BELOW LINE</text>
    <text x="527" y="918" font-size="19" font-weight="700">EXAMPLE B · ABOVE LINE</text>
    <text x="950" y="918" font-size="19" font-weight="700">EXAMPLE C · SIZE INFORMATION</text>
    <text x="318" y="1123" font-size="19" font-weight="700">EXAMPLE D · TAIL / SOURCE CONTROL</text>
  </g>

  <line x1="145" y1="980" x2="405" y2="980" stroke="#111" stroke-width="4"/>
  <line x1="145" y1="980" x2="108" y2="1030" stroke="#111" stroke-width="4"/>
  <polygon points="250,980 278,980 264,1010" fill="none" stroke="#111" stroke-width="4"/>

  <line x1="567" y1="980" x2="827" y2="980" stroke="#111" stroke-width="4"/>
  <line x1="567" y1="980" x2="530" y2="1030" stroke="#111" stroke-width="4"/>
  <polygon points="672,980 700,980 686,950" fill="none" stroke="#111" stroke-width="4"/>

  <line x1="990" y1="980" x2="1250" y2="980" stroke="#111" stroke-width="4"/>
  <line x1="990" y1="980" x2="953" y2="1030" stroke="#111" stroke-width="4"/>
  <text x="1045" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#111">1/4</text>
  <polygon points="1120,980 1148,980 1134,1010" fill="none" stroke="#111" stroke-width="4"/>

  <line x1="390" y1="1180" x2="940" y2="1180" stroke="#111" stroke-width="4"/>
  <line x1="390" y1="1180" x2="345" y2="1230" stroke="#111" stroke-width="4"/>
  <line x1="940" y1="1180" x2="1010" y2="1140" stroke="#111" stroke-width="4"/>
  <line x1="940" y1="1180" x2="1010" y2="1220" stroke="#111" stroke-width="4"/>
  <text x="810" y="1138" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">SEE APPROVED</text>
  <text x="832" y="1162" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">WPS/SWPS</text>

  <rect x="55" y="1330" width="1290" height="355" rx="14" fill="#f7f7f7" stroke="#555" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="82" y="1375" font-size="28" font-weight="700">STEP 3 · PRINT VS. PROCEDURE</text>
    <text x="82" y="1410" font-size="19">Use Bridge Print B. Ask: What comes from the print, and what must come from the approved procedure?</text>
  </g>

  <rect x="90" y="1450" width="760" height="190" fill="#fff" stroke="#222" stroke-width="3"/>
  <text x="112" y="1482" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">BRACKET-B · TRAINING PRINT</text>
  <rect x="160" y="1570" width="365" height="28" fill="#d8d8d8" stroke="#111" stroke-width="3"/>
  <rect x="325" y="1505" width="34" height="93" fill="#ececec" stroke="#111" stroke-width="3"/>
  <line x1="560" y1="1520" x2="405" y2="1560" stroke="#111" stroke-width="3"/>
  <polygon points="405,1560 422,1548 419,1568" fill="#111"/>
  <text x="575" y="1524" font-family="Arial, Helvetica, sans-serif" font-size="17">T-joint location</text>
  <text x="575" y="1560" font-family="Arial, Helvetica, sans-serif" font-size="17">NOTE:</text>
  <text x="575" y="1587" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">WELD PER APPROVED WPS/SWPS</text>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="900" y="1488" font-size="20" font-weight="700">PRINT CAN SHOW</text>
    <text x="925" y="1525" font-size="18">• part relationship</text>
    <text x="925" y="1558" font-size="18">• location</text>
    <text x="925" y="1591" font-size="18">• dimensions / notes shown</text>
    <text x="900" y="1632" font-size="20" font-weight="700">APPROVED PROCEDURE CONTROLS</text>
    <text x="925" y="1665" font-size="18">• procedure variables not supplied by the print</text>
  </g>

  <rect x="55" y="1720" width="1290" height="115" rx="14" fill="#111"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fff">
    <text x="82" y="1763" font-size="25" font-weight="700">STEP 4 · EXIT CHECK</text>
    <text x="82" y="1804" font-size="21">IDENTIFY → FIND THE SOURCE → READ ONLY WHAT IS SPECIFIED → STOP / CHECK IF INFORMATION IS MISSING</text>
  </g>
</svg>