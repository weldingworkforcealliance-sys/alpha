<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="white"/>
<rect x="20" y="20" width="1160" height="1560" rx="18" fill="none" stroke="#222" stroke-width="3"/>
<rect x="40" y="40" width="1120" height="100" rx="12" fill="#102014"/>
<text x="65" y="82" font-family="Arial" font-size="21" fill="#caff77" font-weight="700">PVHS LEVEL II · 4-DAY READINESS REVIEW · DAY 2 OF 4</text>
<text x="65" y="122" font-family="Arial" font-size="34" fill="white" font-weight="700">MATERIAL PROPERTIES — SEE IT, NAME IT, APPLY IT</text>

<text x="55" y="190" font-family="Arial" font-size="25" font-weight="700">STEP 1 · NAME THE PROPERTY</text>
<text x="55" y="220" font-family="Arial" font-size="17">Use Questions 1–6. Match the evidence to the property word before making any material claim.</text>

<g font-family="Arial">
  <g transform="translate(55,250)"><rect width="340" height="170" rx="14" fill="#f7f7f7" stroke="#555"/><text x="20" y="35" font-size="22" font-weight="700">HARDNESS</text><rect x="55" y="85" width="150" height="30" fill="#ddd" stroke="#222"/><path d="M130 55 L150 85 L110 85 Z" fill="#999" stroke="#222"/><text x="20" y="145" font-size="16">Resists indentation / wear.</text></g>
  <g transform="translate(430,250)"><rect width="340" height="170" rx="14" fill="#f7f7f7" stroke="#555"/><text x="20" y="35" font-size="22" font-weight="700">STRENGTH</text><rect x="90" y="70" width="160" height="28" fill="#ddd" stroke="#222"/><line x1="45" y1="84" x2="90" y2="84" stroke="#222" stroke-width="4"/><polygon points="45,84 65,72 65,96" fill="#222"/><line x1="250" y1="84" x2="295" y2="84" stroke="#222" stroke-width="4"/><polygon points="295,84 275,72 275,96" fill="#222"/><text x="20" y="145" font-size="16">Resists applied load / stress.</text></g>
  <g transform="translate(805,250)"><rect width="340" height="170" rx="14" fill="#f7f7f7" stroke="#555"/><text x="20" y="35" font-size="22" font-weight="700">TOUGHNESS</text><rect x="70" y="92" width="180" height="25" fill="#ddd" stroke="#222"/><path d="M275 55 L245 85 L265 105 L295 75 Z" fill="#999" stroke="#222"/><text x="20" y="145" font-size="16">Absorbs energy before fracture.</text></g>
  <g transform="translate(55,440)"><rect width="340" height="170" rx="14" fill="#f7f7f7" stroke="#555"/><text x="20" y="35" font-size="22" font-weight="700">DUCTILITY</text><path d="M70 100 C130 45 210 145 275 75" fill="none" stroke="#555" stroke-width="22" stroke-linecap="round"/><text x="20" y="145" font-size="16">Plastically bends / elongates first.</text></g>
  <g transform="translate(430,440)"><rect width="340" height="170" rx="14" fill="#f7f7f7" stroke="#555"/><text x="20" y="35" font-size="22" font-weight="700">BRITTLENESS</text><line x1="75" y1="95" x2="150" y2="95" stroke="#555" stroke-width="22"/><line x1="190" y1="95" x2="265" y2="95" stroke="#555" stroke-width="22"/><path d="M150 75 l20 18 l-20 18 l40 -18 l-20 -18" fill="none" stroke="#222" stroke-width="3"/><text x="20" y="145" font-size="16">Fractures with little plastic deformation.</text></g>
  <g transform="translate(805,440)"><rect width="340" height="170" rx="14" fill="#f7f7f7" stroke="#555"/><text x="20" y="35" font-size="22" font-weight="700">THERMAL CONDUCTIVITY</text><circle cx="90" cy="95" r="28" fill="#ddd" stroke="#222"/><line x1="125" y1="95" x2="275" y2="95" stroke="#222" stroke-width="5"/><polygon points="275,95 250,80 250,110" fill="#222"/><line x1="155" y1="72" x2="155" y2="118" stroke="#777" stroke-width="2"/><line x1="205" y1="72" x2="205" y2="118" stroke="#777" stroke-width="2"/><text x="20" y="145" font-size="16">Carries heat through the material.</text></g>
</g>

<text x="55" y="665" font-family="Arial" font-size="25" font-weight="700">STEP 2 · COMPARE MATERIAL FAMILIES</text>
<rect x="55" y="690" width="1090" height="260" rx="14" fill="#f7f7f7" stroke="#555"/>
<g font-family="Arial"><line x1="415" y1="710" x2="415" y2="925" stroke="#bbb"/><line x1="785" y1="710" x2="785" y2="925" stroke="#bbb"/><text x="90" y="735" font-size="23" font-weight="700">CARBON STEEL</text><text x="90" y="780" font-size="18">• Often magnetic</text><text x="90" y="815" font-size="18">• Behavior varies with composition</text><text x="90" y="850" font-size="18">• Exact grade controls</text><text x="450" y="735" font-size="23" font-weight="700">STAINLESS STEEL</text><text x="450" y="780" font-size="18">• Alloy family matters</text><text x="450" y="815" font-size="18">• Chromium supports corrosion resistance</text><text x="450" y="850" font-size="18">• Contamination control matters</text><text x="820" y="735" font-size="23" font-weight="700">ALUMINUM</text><text x="820" y="780" font-size="18">• Low density</text><text x="820" y="815" font-size="18">• High thermal conductivity</text><text x="820" y="850" font-size="18">• Oxide / exact alloy-temper matter</text><text x="90" y="910" font-size="18" font-weight="700">SOURCE RULE: a sample or photo can support observation. It does not prove exact grade, alloy, temper, or procedure.</text></g>

<text x="55" y="1005" font-family="Arial" font-size="25" font-weight="700">STEP 3 · APPLY THE PROPERTY</text>
<g font-family="Arial" font-size="18"><g transform="translate(55,1030)"><rect width="520" height="135" rx="12" fill="#fafafa" stroke="#555"/><text x="22" y="38" font-weight="700">SCENARIO 1</text><text x="22" y="75">Must bend before breaking.</text><text x="22" y="108" font-weight="700">PROPERTY → DUCTILITY</text></g><g transform="translate(625,1030)"><rect width="520" height="135" rx="12" fill="#fafafa" stroke="#555"/><text x="22" y="38" font-weight="700">SCENARIO 2</text><text x="22" y="75">Must absorb impact energy.</text><text x="22" y="108" font-weight="700">PROPERTY → TOUGHNESS</text></g><g transform="translate(55,1190)"><rect width="520" height="135" rx="12" fill="#fafafa" stroke="#555"/><text x="22" y="38" font-weight="700">SCENARIO 3</text><text x="22" y="75">Heat moves away rapidly.</text><text x="22" y="108" font-weight="700">PROPERTY → THERMAL CONDUCTIVITY</text></g><g transform="translate(625,1190)"><rect width="520" height="135" rx="12" fill="#fafafa" stroke="#555"/><text x="22" y="38" font-weight="700">SCENARIO 4</text><text x="22" y="75">Surface resists indentation.</text><text x="22" y="108" font-weight="700">PROPERTY → HARDNESS</text></g></g>

<rect x="55" y="1370" width="1090" height="145" rx="14" fill="#102014"/>
<text x="80" y="1415" font-family="Arial" font-size="24" fill="#caff77" font-weight="700">STEP 4 · EXIT CHECK — QUESTIONS 14–16 · NO COACHING</text><text x="80" y="1455" font-family="Arial" font-size="20" fill="white">OBSERVE → CHECK SOURCE → STATE ONLY WHAT THE SOURCE SUPPORTS</text><text x="80" y="1490" font-family="Arial" font-size="16" fill="#ddd">This bridge review does not replace formal Level II metallurgy or source documentation.</text>
</svg>