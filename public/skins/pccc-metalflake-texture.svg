<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="metalflake" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="23" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="contrast">
        <feFuncR type="gamma" amplitude="1.35" exponent="2.1" offset="-0.08"/>
        <feFuncG type="gamma" amplitude="1.35" exponent="2.1" offset="-0.08"/>
        <feFuncB type="gamma" amplitude="1.35" exponent="2.1" offset="-0.08"/>
        <feFuncA type="table" tableValues="0 0.04 0.08 0.14 0.22"/>
      </feComponentTransfer>
      <feSpecularLighting in="contrast" surfaceScale="1.8" specularConstant="0.95" specularExponent="22" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="228" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceGraphic" operator="in" result="specMasked"/>
      <feBlend in="contrast" in2="specMasked" mode="screen"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="#ffffff" opacity="0.15" filter="url(#metalflake)"/>
</svg>
