  function wrapperBase(){
    const u=new URL(location.href);
    u.search='';u.hash='';
    if(new URLSearchParams(location.search).get('monitor')==='1')u.searchParams.set('monitor','1');
    return u.toString();
  }

  function rewritePairing(doc){
    const link=doc.getElementById('joinLink');
    if(!link || !link.textContent || link.dataset.wrapperDone==='1')return;
    let old;
    try{old=new URL(link.textContent.trim());}catch{return;}
    const session=old.searchParams.get('session');
    const join=old.searchParams.get('join');
    if(!session||!join)return;
    const newJoin=new URL(wrapperBase());
    newJoin.searchParams.set('session',session);
    newJoin.searchParams.set('join',join);
    link.textContent=newJoin.toString();
    link.dataset.wrapperDone='1';

    const qr=doc.getElementById('qr');
    if(qr && qr.src){
      try{
        const q=new URL(qr.src);
        q.searchParams.set('target',wrapperBase());
        qr.src=q.toString();
      }catch{}
    }
  }

  function applyUpgrade(){
    let doc;
    try{doc=frame.contentDocument;}catch{return;}
    if(!doc || !doc.documentElement)return;
    doc.documentElement.classList.add('lk-graphics-v2');
    if(!doc.getElementById('lkGraphicsV2Style')){
      const style=doc.createElement('style');
      style.id='lkGraphicsV2Style';
      style.textContent=upgradeCSS;
      doc.head.appendChild(style);
    }
    rewritePairing(doc);
    const observer=new MutationObserver(()=>rewritePairing(doc));
    observer.observe(doc.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['src']});
    loading.classList.add('done');
  }

  frame.addEventListener('load',()=>{
    applyUpgrade();
    setTimeout(applyUpgrade,250);
  });
})();
