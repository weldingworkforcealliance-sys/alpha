# Netlify deploy safety for LTG.
#
# Production continues to use the Netlify UI/project configuration.
# Deploy Previews are pinned to the isolated Gltg Supabase staging project so
# preview builds cannot accidentally operate against the live beta database.
#
# The publishable key below is intentionally browser-safe. Never place a
# service-role key, secret key, Resend key, or cron secret in this file.

# Preserve the requested path when someone uses the legacy Netlify hostname.
# This prevents /demo and every nested /demo/* route from collapsing back to
# the canonical LTG homepage when Netlify sends traffic to ltgeducation.com.
[[redirects]]
  from = "https://livingtguide.netlify.app/*"
  to = "https://ltgeducation.com/:splat"
  status = 301
  force = true

[build]
  command = "rm -rf .next && npm run build"

[context.deploy-preview.environment]
  NEXT_PUBLIC_WLD110_SHOP_ENABLED = "true"
  NEXT_PUBLIC_GRADEBOOK_FINALS_ENABLED = "true"
  NEXT_PUBLIC_TOWER_ENABLED = "true"
  NEXT_PUBLIC_GRADEBOOK_ENABLED = "true"
  NEXT_PUBLIC_SUPABASE_URL = "https://ezlvivmeneefiiwqwgqd.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_VDQ-Ug5VBliSzl1I-FKCog_ZNPv-g7R"
  NEXT_PUBLIC_DEPLOYMENT_ENV = "staging"
  NEXT_PUBLIC_REQUIRE_MFA = "true"

# Gradebook migrations verified in production September 17, 2026.
[context.production.environment]
  NEXT_PUBLIC_GRADEBOOK_ENABLED = "true"
  NEXT_PUBLIC_GRADEBOOK_FINALS_ENABLED = "true"


# Baseline response hardening for institutional deployment.
# CSP is handled separately because LTG currently uses framework/runtime inline
# scripts and external Supabase connections; it will be introduced after a
# report-only compatibility pass.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
