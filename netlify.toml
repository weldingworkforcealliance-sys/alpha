# Netlify deploy safety for LTG.
#
# Production continues to use the Netlify UI/project configuration.
# Deploy Previews are pinned to the isolated Gltg Supabase staging project so
# preview builds cannot accidentally operate against the live beta database.
#
# The publishable key below is intentionally browser-safe. Never place a
# service-role key, secret key, Resend key, or cron secret in this file.

[context.deploy-preview.environment]
  NEXT_PUBLIC_SUPABASE_URL = "https://ezlvivmeneefiiwqwgqd.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_VDQ-Ug5VBliSzl1I-FKCog_ZNPv-g7R"
  NEXT_PUBLIC_DEPLOYMENT_ENV = "staging"

# Baseline response hardening. CSP is intentionally handled separately because
# LTG currently relies on framework/runtime scripts and external Supabase assets;
# shipping a guessed CSP would be more likely to break production than secure it.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
