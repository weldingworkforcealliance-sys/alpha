name: NJCWWA Employer Outreach CI

on:
  pull_request:
    paths:
      - "apps-script/njcwwa-employer-outreach/**"
      - ".github/workflows/njcwwa-employer-outreach-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps-script/njcwwa-employer-outreach/**"
      - ".github/workflows/njcwwa-employer-outreach-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps-script/njcwwa-employer-outreach
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm run check
