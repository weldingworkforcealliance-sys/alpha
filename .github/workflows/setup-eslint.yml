name: Setup ESLint

on:
  push:
    branches: [main]
    paths:
      - maintenance/run-eslint-setup

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install lint dependencies
        run: npm install --save-dev eslint@^10 @typescript-eslint/parser@^8 @typescript-eslint/eslint-plugin@^8

      - name: Remove confirmed dead Training Mode state
        run: |
          python <<'EOF'
          from pathlib import Path
          path = Path('app/training/page.tsx')
          text = path.read_text()
          text = text.replace("  const [userId,setUserId] = useState('');\n", '')
          text = text.replace('    setUserId(uid);\n', '')
          path.write_text(text)
          EOF

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint -- --max-warnings=0

      - name: Next.js build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-build-placeholder
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit final QA cleanup
        run: |
          git config user.name "weldingworkforcealliance-sys"
          git config user.email "weldingworkforcealliance@gmail.com"
          git add package.json package-lock.json app/training/page.tsx
          git commit -m "Finish ESLint 10 cleanup"
          git push
