name: Classroom Service Refactor

on:
  push:
    branches:
      - main
    paths:
      - maintenance/run-classroom-service-refactor

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply refactor
        run: python maintenance/classroom-service-refactor.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-build-placeholder
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit refactor
        run: |
          git config user.name "weldingworkforcealliance-sys"
          git config user.email "weldingworkforcealliance@gmail.com"
          git add app/classroom/page.tsx app/classroom/planner/page.tsx
          git commit -m "Share classroom session service across launchers"
          git push
