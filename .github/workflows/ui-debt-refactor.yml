name: UI Debt Refactor

on:
  push:
    branches: [main]
    paths:
      - maintenance/run-ui-debt-refactor

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor legacy UI patching and logout handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Root layout: remove runtime DOM-patching/logout interception components.
          replace_once(
              'app/layout.tsx',
              "import BetaUiConsistency from './beta-ui-consistency';\nimport ClockAwareLogoutGuard from './clock-aware-logout-guard';\n",
              ''
          )
          replace_once('app/layout.tsx', '        <ClockAwareLogoutGuard />\n', '')
          replace_once('app/layout.tsx', '          <BetaUiConsistency pathname={pathname} />\n', '')

          # Dashboard: explicit clock-aware logout + render correct course labels directly.
          replace_once(
              'app/dashboard/page.tsx',
              "import { SCHOOL_DASHBOARD_ROLES } from '@/lib/access-roles';\n",
              "import { SCHOOL_DASHBOARD_ROLES } from '@/lib/access-roles';\nimport { guardedSignOut } from '@/lib/guarded-signout';\n"
          )
          replace_once(
              'app/dashboard/page.tsx',
              "  const handleLogout = async () => {\n    await supabase.auth.signOut();\n    router.push('/login');\n  };\n",
              "  const handleLogout = async () => {\n    await guardedSignOut();\n  };\n"
          )
          replace_once(
              'app/dashboard/page.tsx',
              "  const plannedInstructionalMinutes =\n    guideSegments.reduce((total, segment) => total + segment.planned_minutes, 0) +\n    (mathLesson?.planned_minutes ?? 0);\n",
              "  const guideInstructionalMinutes = guideSegments.reduce(\n    (total, segment) => total + segment.planned_minutes,\n    0\n  );\n  const plannedInstructionalMinutes =\n    guideInstructionalMinutes + (mathLesson?.planned_minutes ?? 0);\n  const selectedCourseLabel =\n    selectedSection?.course_code || selectedSection?.course_name || 'Course';\n"
          )
          replace_once(
              'app/dashboard/page.tsx',
              "                          {mathLesson\n                            ? `${guideSegments.reduce(\n                                (sum, segment) => sum + segment.planned_minutes,\n                                0\n                              )} min WLD-105 + ${mathLesson.planned_minutes} min Welding Math`\n                            : `${guideSegments.reduce(\n                                (sum, segment) => sum + segment.planned_minutes,\n                                0\n                              )} min WLD-105`}\n",
              "                          {mathLesson\n                            ? `${guideInstructionalMinutes} min ${selectedCourseLabel} + ${mathLesson.planned_minutes} min Welding Math`\n                            : `${guideInstructionalMinutes} min ${selectedCourseLabel}`}\n"
          )
          replace_once(
              'app/dashboard/page.tsx',
              "                                <h4>{mathLesson ? 'WLD-105 Agenda' : 'Daily Agenda'}</h4>\n",
              "                                <h4>{mathLesson ? `${selectedCourseLabel} Agenda` : 'Daily Agenda'}</h4>\n"
          )
          replace_once(
              'app/dashboard/page.tsx',
              '<p>PVHS schedule and no-class reminders.</p>',
              '<p>Class schedule and no-class reminders.</p>'
          )

          # Owner page: shared browser client + explicit clock-aware logout.
          replace_once(
              'app/owner/page.tsx',
              "import { createBrowserClient } from '@supabase/ssr';\n",
              "import { getSupabase } from '@/lib/supabase-browser';\nimport { guardedSignOut } from '@/lib/guarded-signout';\n"
          )
          replace_once(
              'app/owner/page.tsx',
              "  const [supabase] = useState(() =>\n    createBrowserClient(\n      process.env.NEXT_PUBLIC_SUPABASE_URL!,\n      process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY!\n    )\n  );\n",
              "  const [supabase] = useState(getSupabase);\n"
          )
          replace_once(
              'app/owner/page.tsx',
              "  const handleLogout = async () => {\n    await supabase.auth.signOut();\n    router.push('/login');\n  };\n",
              "  const handleLogout = async () => {\n    await guardedSignOut();\n  };\n"
          )

          # School page: shared browser client + explicit clock-aware logout.
          replace_once(
              'app/school/page.tsx',
              "import { createBrowserClient } from '@supabase/ssr';\n",
              "import { getSupabase } from '@/lib/supabase-browser';\nimport { guardedSignOut } from '@/lib/guarded-signout';\n"
          )
          replace_once(
              'app/school/page.tsx',
              "  const [supabase] = useState(() =>\n    createBrowserClient(\n      process.env.NEXT_PUBLIC_SUPABASE_URL!,\n      process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY!\n    )\n  );\n",
              "  const [supabase] = useState(getSupabase);\n"
          )
          replace_once(
              'app/school/page.tsx',
              "  const handleLogout = async () => {\n    await supabase.auth.signOut();\n    router.push('/login');\n  };\n",
              "  const handleLogout = async () => {\n    await guardedSignOut();\n  };\n"
          )
          PY

          git config user.name "weldingworkforcealliance-sys"
          git config user.email "weldingworkforcealliance@gmail.com"
          git add app/layout.tsx app/dashboard/page.tsx app/owner/page.tsx app/school/page.tsx
          git commit -m "Retire legacy UI patching and explicit logout interception"
          git push
