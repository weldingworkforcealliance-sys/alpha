name: Setup Unit Tests

on:
  push:
    branches: [main]
    paths:
      - maintenance/run-unit-test-setup

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vitest
        run: npm install --save-dev vitest@^5.0.0

      - name: Add test script
        run: |
          node <<'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.scripts.test = 'vitest run';
          pkg.scripts.check = 'npm run typecheck && npm run lint && npm run test';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          EOF

      - name: Centralize welding class capacity
        run: |
          cat > lib/program-constraints.ts <<'EOF'
          /** Maximum students supported by the welding program's lab capacity. */
          export const MAX_WELDING_CLASS_CAPACITY = 17;
          EOF
          python <<'EOF'
          from pathlib import Path
          targets = [Path('app/classroom/page.tsx'), Path('app/classroom/planner/page.tsx')]
          for path in targets:
              text = path.read_text()
              if "@/lib/program-constraints" not in text:
                  marker = "import { getSupabase } from '@/lib/supabase-browser';\n"
                  if marker not in text:
                      raise SystemExit(f'Missing Supabase import marker in {path}')
                  text = text.replace(marker, marker + "import { MAX_WELDING_CLASS_CAPACITY } from '@/lib/program-constraints';\n", 1)
              text = text.replace('useState(17)', 'useState(MAX_WELDING_CLASS_CAPACITY)')
              path.write_text(text)
          EOF

      - name: Write baseline tests
        run: |
          mkdir -p tests
          cat > tests/access-roles.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import {
            PAYROLL_ROLES,
            REVIEW_QUEUE_ROLES,
            SCHOOL_DASHBOARD_ROLES,
            roleAllowed,
          } from '../lib/access-roles';

          describe('access role policy', () => {
            it('does not grant payroll authority to viewer', () => {
              expect(roleAllowed('viewer', PAYROLL_ROLES)).toBe(false);
            });

            it('allows the intended payroll management roles', () => {
              for (const role of ['school_admin', 'program_lead', 'lead_instructor']) {
                expect(roleAllowed(role, PAYROLL_ROLES)).toBe(true);
              }
            });

            it('keeps review queue narrower than school dashboard access', () => {
              expect(roleAllowed('lead_instructor', REVIEW_QUEUE_ROLES)).toBe(false);
              expect(roleAllowed('viewer', SCHOOL_DASHBOARD_ROLES)).toBe(true);
            });
          });
          EOF

          cat > tests/program-constraints.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { MAX_WELDING_CLASS_CAPACITY } from '../lib/program-constraints';

          describe('welding program constraints', () => {
            it('keeps the lab-supported class maximum at 17 students', () => {
              expect(MAX_WELDING_CLASS_CAPACITY).toBe(17);
            });
          });
          EOF

          cat > tests/classroom-session.test.ts <<'EOF'
          import { describe, expect, it, vi } from 'vitest';
          import { createClassroomSession } from '../lib/classroom-session';

          function fakeSupabase(returnedSession: Record<string, unknown>) {
            const single = vi.fn().mockResolvedValue({ data: returnedSession, error: null });
            const eq = vi.fn().mockReturnValue({ single });
            const select = vi.fn().mockReturnValue({ eq });
            const from = vi.fn().mockReturnValue({ select });
            const rpc = vi.fn().mockResolvedValue({ data: 'session-1', error: null });
            return { client: { rpc, from } as any, rpc };
          }

          describe('createClassroomSession', () => {
            it('passes exact launch context to the v2 RPC', async () => {
              const { client, rpc } = fakeSupabase({
                id: 'session-1', join_code: 'ABC123', status: 'active',
                started_at: '2026-09-05T12:00:00Z', expires_at: '2026-09-05T20:00:00Z',
                section_id: 'section-a', assessment_slug: 'blueprint_day1', expected_students: 17,
              });

              await createClassroomSession(client, {
                sectionId: 'section-a', assessmentSlug: 'blueprint_day1', expectedStudents: 17,
              });

              expect(rpc).toHaveBeenCalledWith('start_classroom_session_v2', {
                p_section_id: 'section-a',
                p_assessment_slug: 'blueprint_day1',
                p_expected_students: 17,
              });
            });

            it('rejects a session returned for a different class', async () => {
              const { client } = fakeSupabase({
                id: 'session-1', join_code: 'ABC123', status: 'active',
                started_at: '2026-09-05T12:00:00Z', expires_at: '2026-09-05T20:00:00Z',
                section_id: 'wrong-section', assessment_slug: 'blueprint_day1', expected_students: 17,
              });

              await expect(createClassroomSession(client, {
                sectionId: 'section-a', assessmentSlug: 'blueprint_day1', expectedStudents: 17,
              })).rejects.toThrow('did not match the requested class and assessment');
            });

            it('rejects a session returned for a different assessment', async () => {
              const { client } = fakeSupabase({
                id: 'session-1', join_code: 'ABC123', status: 'active',
                started_at: '2026-09-05T12:00:00Z', expires_at: '2026-09-05T20:00:00Z',
                section_id: 'section-a', assessment_slug: 'preclass_math', expected_students: 17,
              });

              await expect(createClassroomSession(client, {
                sectionId: 'section-a', assessmentSlug: 'blueprint_day1', expectedStudents: 17,
              })).rejects.toThrow('did not match the requested class and assessment');
            });
          });
          EOF

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm run test

      - name: Next.js build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-build-placeholder
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit test foundation
        run: |
          git config user.name "weldingworkforcealliance-sys"
          git config user.email "weldingworkforcealliance@gmail.com"
          git add package.json package-lock.json lib/program-constraints.ts app/classroom/page.tsx app/classroom/planner/page.tsx tests
          git commit -m "Add LTG unit test foundation"
          git push
