name: LTG Build Check

on:
  push:
    branches:
      - main
      - product/standalone-mainline-2026-09-11
  pull_request:
    branches: [main, product/standalone-mainline-2026-09-11]

jobs:
  archive-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: ltg_archive_recovery
          POSTGRES_USER: archive_drill
          POSTGRES_PASSWORD: synthetic-local-drill-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix scripts/archive --ignore-scripts
      - name: Recover synthetic history in isolated PostgreSQL
        run: node --test scripts/archive/*.test.mjs
        env:
          LTG_ARCHIVE_DB_DRILL: 'true'
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration filename guard
        run: npm run check:migrations

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm run test

      - name: Archive unit tests
        run: node --test scripts/archive/*.test.mjs

      - name: Next.js build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-build-placeholder
        run: npm run build

      - name: Public route smoke test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-build-placeholder
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/ltg-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          if ! npm run smoke:routes; then
            cat /tmp/ltg-next.log
            exit 1
          fi
