<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d09">
<title>Corvu Mor Bocce — Living Kingdoms Premium V3</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040704;color:#f5edda;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#game{display:block;width:100%;height:100dvh;border:0;background:#040704}
#loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle at 50% 18%,#76501f55,#11170f 40%,#040704 78%);transition:opacity .35s ease}
#loading.done{opacity:0;pointer-events:none}.load-card{text-align:center;padding:30px 34px;border:1px solid #9d7b43;border-radius:20px;background:#0e140eea;box-shadow:0 28px 90px #000d,inset 0 1px #f5daa338}.crown{font-size:44px;color:#e0b85e;text-shadow:0 0 22px #e0b85e80}.title{font:900 31px/1 Georgia,"Times New Roman",serif;letter-spacing:.09em;color:#f0dca5;margin-top:8px}.small{font-size:10px;letter-spacing:.2em;color:#ad9565;margin-top:9px}
</style>
</head>
<body>
<div id="loading"><div class="load-card"><div class="crown">♛</div><div class="title">LIVING KINGDOMS</div><div class="small">PREMIUM COURT · V3</div></div></div>
<iframe id="game" title="Corvu Mor TwinLane Bocce" allow="autoplay; fullscreen; clipboard-read; clipboard-write"></iframe>
<script>
(() => {
  const APPROVED_GAME='https://raw.githack.com/weldingworkforcealliance-sys/alpha/0e333a102d2059378d8eb2ca32173048c824f886/twinlane-live/index.html';
  const WRAPPER_BASE=location.origin+location.pathname;
  const ASSET_BASE='https://raw.githack.com/weldingworkforcealliance-sys/alpha/feature/living-kingdoms-graphics-v3/twinlane-graphics-v3/assets/';
  const frame=document.getElementById('game');
  const loading=document.getElementById('loading');
  frame.src=APPROVED_GAME+location.search;

  const premiumCSS=String.raw`
:root{--lk3-far:url("${ASSET_BASE}premium-far.webp");--lk3-header:url("${ASSET_BASE}premium-header.webp");--lk3-left:url("${ASSET_BASE}premium-near-left.webp");--lk3-right:url("${ASSET_BASE}premium-near-right.webp")}
html.lk-premium-v3,html.lk-premium-v3 body{background:#040704!important;color:#f9efd6!important}
html.lk-premium-v3 body{background-image:radial-gradient(circle at 50% -15%,#e4b95635,transparent 28%),linear-gradient(180deg,#10170e,#050805 72%)!important}
html.lk-premium-v3 body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#02030235,#040704e9 76%),var(--lk3-far) center top/cover no-repeat;filter:saturate(1.28) contrast(1.08) brightness(.78);opacity:.55}
html.lk-premium-v3 main{max-width:820px!important;padding:10px 10px 34px!important}
html.lk-premium-v3 .brandbar{border:1px solid #8c6e3d;border-radius:16px;padding:12px 14px;background:linear-gradient(180deg,#171d14f5,#090d09f8);box-shadow:0 18px 44px #000a,inset 0 1px #f5d99b38}
html.lk-premium-v3 .brand-title{font-size:36px!important;letter-spacing:.11em!important;color:#f1d99d!important;text-shadow:0 3px 10px #000,0 0 24px #d6a84c38!important}
html.lk-premium-v3 .skin-chip{background:linear-gradient(180deg,#263521,#10160e)!important;border-color:#c09a55!important;color:#f0d18a!important;box-shadow:inset 0 1px #fff3,0 0 18px #e3b5522d!important}
html.lk-premium-v3 #productHome{min-height:min(670px,78vh);display:flex;flex-direction:column;justify-content:flex-end;padding:38px 24px!important;background-image:linear-gradient(180deg,#0203020a 0,#02030212 28%,#050805d4 69%,#050805fa 100%),var(--lk3-far)!important;background-position:center top!important;background-size:cover!important;border:2px solid #b88d4a!important;box-shadow:0 30px 85px #000d,inset 0 0 0 1px #f5d99435!important}
html.lk-premium-v3 #productHome::after{content:"♛";position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:68px;color:#e0b75b;text-shadow:0 0 30px #e5b6569a,0 5px 12px #000}
html.lk-premium-v3 .home-title{font-size:clamp(56px,13vw,90px)!important;color:#f4dea8!important;text-shadow:0 5px 18px #000,0 0 32px #d8a7463d!important}
html.lk-premium-v3 button.primary,html.lk-premium-v3 .home-play{background:linear-gradient(180deg,#e8cb7c,#a27635)!important;border-color:#ffe4a5!important;color:#1a1308!important;box-shadow:inset 0 1px #fff9,0 9px 25px #0008,0 0 20px #d3a03d2d!important}
html.lk-premium-v3 .card{border-color:#785f39!important;background:linear-gradient(180deg,#161c13f5,#080c08f8)!important;box-shadow:0 18px 46px #000a,inset 0 1px #f0d89c30!important}
html.lk-premium-v3 #matchHud{border:0!important;background:transparent!important;box-shadow:none!important;padding:3px!important}
html.lk-premium-v3 .score-team{position:relative;min-height:96px!important;padding:10px 14px 17px!important;border:2px solid #d5ae61!important;border-radius:8px 8px 23px 23px!important;clip-path:polygon(0 0,100% 0,100% 77%,85% 100%,15% 100%,0 77%)!important;box-shadow:0 12px 24px #000b,inset 0 0 0 2px #241507,inset 0 1px #fff4!important}
html.lk-premium-v3 .score-team.a{background:linear-gradient(180deg,#175033,#0a2b1b 68%,#04140d)!important}html.lk-premium-v3 .score-team.b{background:linear-gradient(180deg,#751f18,#3d100d 68%,#1b0706)!important}
html.lk-premium-v3 .score-team::after{content:"♛";position:absolute;top:7px;color:#e1b85e;font-size:17px;text-shadow:0 2px 5px #000}html.lk-premium-v3 .score-team.a::after{right:10px}html.lk-premium-v3 .score-team.b::after{left:10px}
html.lk-premium-v3 .score-num{font-size:45px!important;color:#f5dfb0!important;text-shadow:0 4px 8px #000!important}
html.lk-premium-v3 .turnbox,html.lk-premium-v3 .game-banner{border:2px solid #9f7b40!important;background:linear-gradient(180deg,#302819,#11120b)!important;box-shadow:0 9px 20px #000a,inset 0 0 0 2px #3a2a16!important;color:#f2db9e!important}
html.lk-premium-v3 #viewPanel{position:relative;overflow:visible;border:2px solid #a17b41!important;background:linear-gradient(180deg,#17180f,#080a07)!important;padding:10px!important;box-shadow:0 30px 70px #000d,inset 0 0 0 1px #f4d28f32!important}
html.lk-premium-v3 #viewPanel .lane{isolation:isolate;border:2px solid #c4934c!important;background-color:#b48b55!important;background-image:repeating-linear-gradient(0deg,#b98e58 0,#b98e58 14px,#b28751 15px,#ba925c 17px)!important;box-shadow:inset 0 0 54px #0008,inset 0 0 0 2px #f1ca7830,0 15px 36px #000b!important}
html.lk-premium-v3 #viewPanel .lane::before{content:""!important;position:absolute!important;inset:0!important;z-index:0!important;pointer-events:none!important;background-repeat:no-repeat!important;background-position:center top!important;background-size:100% 49%!important;filter:saturate(1.22) contrast(1.09) brightness(1.05)!important;opacity:1!important;transform:translateZ(0)!important}
html.lk-premium-v3 #viewPanel[data-skin-view="far"] .lane::before{background-image:linear-gradient(180deg,#0000 0 69%,#b48b55e8 94%,#b48b55 100%),var(--lk3-header)!important}
html.lk-premium-v3 #viewPanel[data-skin-view="near"] .lane::before{background-image:linear-gradient(180deg,#0000 0 66%,#b48b55df 92%,#b48b55 100%),var(--lk3-far)!important}
html.lk-premium-v3 .living-ambient{z-index:0!important}html.lk-premium-v3 .living-ambient::before,html.lk-premium-v3 .living-ambient::after{content:"";position:absolute;bottom:0;width:38%;height:67%;pointer-events:none;background-repeat:no-repeat;background-position:bottom;background-size:contain;opacity:.88;filter:saturate(1.16) contrast(1.05);z-index:0;animation:lk3Lantern 4.8s ease-in-out infinite}
html.lk-premium-v3 .living-ambient::before{left:-3%;background-image:var(--lk3-left);background-position:left bottom}html.lk-premium-v3 .living-ambient::after{right:-3%;background-image:var(--lk3-right);background-position:right bottom}
html.lk-premium-v3 #settledLayer,html.lk-premium-v3 .pallino,html.lk-premium-v3 .ball,html.lk-premium-v3 .rails,html.lk-premium-v3 .start-zone,html.lk-premium-v3 .start-label,html.lk-premium-v3 .flick-line{z-index:3!important}
html.lk-premium-v3 #viewPanel .rails{inset:0 7.7%!important;border-left:7px solid #aa7037!important;border-right:7px solid #aa7037!important;box-shadow:-14px 0 0 #4c2d18,14px 0 0 #4c2d18,-24px 0 28px #0009,24px 0 28px #0009,inset 9px 0 9px #f3b9653a,inset -9px 0 9px #f3b9653a!important}
html.lk-premium-v3 #viewPanel[data-skin-view="far"] .rails{border-top:9px solid #71451f!important}
html.lk-premium-v3 #viewPanel[data-skin-view="near"]::after,html.lk-premium-v3 #viewPanel[data-skin-view="far"]::after{border:2px solid #ad8245!important;background:linear-gradient(180deg,#51341c,#221309)!important;color:#f5dfb1!important;font-size:13px!important;padding:8px 14px!important;box-shadow:0 9px 20px #000b,inset 0 0 0 2px #2d190c,0 0 20px #d9a4492f!important}
html.lk-premium-v3 .ball,html.lk-premium-v3 .settled-ball{border:2px solid #e3bb65!important;outline:1px solid #1a0e07!important;box-shadow:inset -8px -10px 13px #000a,inset 6px 6px 8px #fff7,0 8px 14px #000b,0 0 0 2px #e0b96820!important}
html.lk-premium-v3 .ball.team-a,html.lk-premium-v3 .settled-ball.team-a{background:radial-gradient(circle at 30% 23%,#a9ecc8 0 7%,#2a8052 22%,#0d472e 56%,#03170e 100%)!important}html.lk-premium-v3 .ball.team-b,html.lk-premium-v3 .settled-ball.team-b{background:radial-gradient(circle at 30% 23%,#f5ad8b 0 7%,#bb3d2b 22%,#701b17 56%,#240706 100%)!important}
html.lk-premium-v3 .ball::after,html.lk-premium-v3 .settled-ball::after{content:"♛";position:absolute;inset:0;display:grid;place-items:center;color:#ebc263;font-size:13px;text-shadow:0 2px 4px #000;pointer-events:none}
html.lk-premium-v3 .pallino{background:radial-gradient(circle at 29% 22%,#fffde9 0 10%,#f4d67d 29%,#bd8b31 63%,#4d2f0b 100%)!important;border-color:#ffe8a5!important;box-shadow:inset -4px -6px 7px #0008,inset 3px 3px 5px #fff9,0 6px 11px #000a,0 0 14px #efd77d62!important}
@keyframes lk3Lantern{0%,100%{filter:brightness(.96) saturate(1.08)}50%{filter:brightness(1.08) saturate(1.2)}}@media(prefers-reduced-motion:reduce){html.lk-premium-v3 .living-ambient::before,html.lk-premium-v3 .living-ambient::after{animation:none}}
@media(max-width:600px){html.lk-premium-v3 main{padding:6px 6px 24px!important}html.lk-premium-v3 .brand-title{font-size:28px!important}html.lk-premium-v3 .score-team{min-height:80px!important;padding:8px 9px 13px!important}html.lk-premium-v3 .score-num{font-size:35px!important}html.lk-premium-v3 #viewPanel{padding:6px!important}html.lk-premium-v3 .living-ambient::before,html.lk-premium-v3 .living-ambient::after{width:45%;height:57%;opacity:.72}html.lk-premium-v3 #viewPanel .rails{inset:0 7.5%!important;border-left-width:5px!important;border-right-width:5px!important}}
`;

  function rewritePairing(doc){try{const join=doc.getElementById('joinLink');if(join&&join.textContent){const old=new URL(join.textContent);const next=new URL(WRAPPER_BASE);for(const [k,v] of old.searchParams)next.searchParams.set(k,v);if(location.search.includes('monitor=1'))next.searchParams.set('monitor','1');join.textContent=next.toString()}const qr=doc.getElementById('qr');if(qr&&qr.src){const u=new URL(qr.src);u.searchParams.set('target',WRAPPER_BASE+(location.search.includes('monitor=1')?'?monitor=1':''));qr.src=u.toString()}}catch{}}
  function applyUpgrade(){let doc;try{doc=frame.contentDocument}catch{return}if(!doc?.documentElement)return;doc.documentElement.classList.add('lk-premium-v3');if(!doc.getElementById('lk-premium-v3-style')){const style=doc.createElement('style');style.id='lk-premium-v3-style';style.textContent=premiumCSS;doc.head.appendChild(style)}rewritePairing(doc);new MutationObserver(()=>rewritePairing(doc)).observe(doc.body,{childList:true,subtree:true,attributes:true,attributeFilter:['src','class']});loading.classList.add('done')}
  frame.addEventListener('load',()=>setTimeout(applyUpgrade,80));
})();
</script>
</body>
</html>
